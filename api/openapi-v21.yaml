openapi: 3.1.2
info:
  title: RBVM CSV Import API with Finding Context Associations
  version: 0.23.2
  description: >-
    Composed OpenAPI view retaining every published 0.23.2 operation and adding the
    explicit Finding Context Association V1 routes. Referenced path items remain owned by
    their source contracts so this composition cannot silently simplify existing schemas.

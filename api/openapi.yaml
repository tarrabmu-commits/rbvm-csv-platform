        FINANCIAL: {type: integer, format: int64, minimum: 0}
        REGULATORY: {type: integer, format: int64, minimum: 0}
        OPERATIONAL: {type: integer, format: int64, minimum: 0}
        REPUTATIONAL: {type: integer, format: int64, minimum: 0}
        MISSION: {type: integer, format: int64, minimum: 0}
        OTHER: {type: integer, format: int64, minimum: 0}
        UNKNOWN: {type: integer, format: int64, minimum: 0}
    BusinessImpactLevelDistribution:
      type: object
      additionalProperties: false
      required: [SEVERE, HIGH, MODERATE, LOW, NEGLIGIBLE, UNKNOWN]
      properties:
        SEVERE: {type: integer, format: int64, minimum: 0}
        HIGH: {type: integer, format: int64, minimum: 0}
        MODERATE: {type: integer, format: int64, minimum: 0}
        LOW: {type: integer, format: int64, minimum: 0}
        NEGLIGIBLE: {type: integer, format: int64, minimum: 0}
        UNKNOWN: {type: integer, format: int64, minimum: 0}
    BusinessImpactMethodDistribution:
      type: object
      additionalProperties: false
      required: [BUSINESS_IMPACT_ANALYSIS, SERVICE_OWNER_ATTESTATION, POLICY_CLASSIFICATION, INCIDENT_ANALYSIS, OTHER, UNKNOWN]
      properties:
        BUSINESS_IMPACT_ANALYSIS: {type: integer, format: int64, minimum: 0}
        SERVICE_OWNER_ATTESTATION: {type: integer, format: int64, minimum: 0}
        POLICY_CLASSIFICATION: {type: integer, format: int64, minimum: 0}
        INCIDENT_ANALYSIS: {type: integer, format: int64, minimum: 0}
        OTHER: {type: integer, format: int64, minimum: 0}
        UNKNOWN: {type: integer, format: int64, minimum: 0}
    BusinessImpactIssue:
      type: object
      additionalProperties: false
      required: [rowNumber, level, code, message]
      properties:
        rowNumber: {type: integer, format: int64, minimum: 1}
        level: {enum: [WARNING, ERROR]}
        code: {type: string}
        message: {type: string}
    CaseAuditEvent:
      type: object
      required:
        - sequence
        - eventId
        - caseId
        - caseVersion
        - action
        - fromStatus
        - toStatus
        - reason
        - expiresAt
        - evidenceReference
        - actorId
        - actorAssurance
        - occurredAt
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        eventId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        caseId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        caseVersion:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [ACCEPT_RISK, MARK_FALSE_POSITIVE, CLOSE_MANUAL, REOPEN, COMMENT]
        fromStatus:
          type: string
          enum: [OPEN, SOURCE_RESOLVED, ACCEPTED_RISK, FALSE_POSITIVE, CLOSED_MANUAL]
        toStatus:
          type: string
          enum: [OPEN, SOURCE_RESOLVED, ACCEPTED_RISK, FALSE_POSITIVE, CLOSED_MANUAL]
        reason:
          type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
        evidenceReference:
          type: [string, 'null']
        actorId:
          type: string
        actorAssurance:
          type: string
        occurredAt:
          type: string
          format: date-time
    CaseActionResult:
      type: object
      required: [replayed, case, auditEvent]
      properties:
        replayed:
          type: boolean
        case:
          $ref: '#/components/schemas/CaseDetail'
        auditEvent:
          $ref: '#/components/schemas/CaseAuditEvent'
    Problem:
      type: object
      required: [type, title, status, detail, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
  responses:
    AuthenticationRequired:
      description: Missing, expired, or invalid bearer API key
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InsufficientRole:
      description: Authenticated identity lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Per-actor or failed-authentication request limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Request could not be completed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

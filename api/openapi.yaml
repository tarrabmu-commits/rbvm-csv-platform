openapi: 3.1.2
info:
  title: RBVM CSV Import API
  version: 0.23.0
  description: >-
    Synchronous upload, validation, preview, and canonical-domain materialization
    API for WAZUH_CSV_V1 positive observations and opt-in WAZUH_CSV_V2 explicit
    finding lifecycle evidence, separate finding-scoped applicability assessment,
    independent CVSS v3.1 Base technical-severity evidence, snapshot-bound CISA KEV
    threat evidence, independent FIRST EPSS exploitation-probability evidence,
    independent asset-scoped organizational context evidence, independent scoped
    network reachability evidence, independent qualitative Business/Mission Impact
    evidence, customer-managed asset inventory, explicit customer-confirmed scanner-to-managed-asset
    link decisions, explicit case decisions, an append-only workflow audit trail, and optional
    PostgreSQL canonical persistence.
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service and recovery state
      responses:
        '200':
          description: Current service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /live:
    get:
      security: []
      operationId: getLiveness
      summary: Check whether the HTTP process is running
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                required: [status, startedAt]
                properties:
                  status:
                    const: UP
                  startedAt:
                    type: string
                    format: date-time
  /ready:
    get:
      security: []
      operationId: getReadiness
      summary: Check database and projection readiness
      responses:
        '200':
          description: Service dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
        '503':
          description: A required dependency is unavailable or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
  /metrics:
    get:
      operationId: getMetrics
      summary: Read Prometheus-compatible operational metrics
      responses:
        '200':
          description: Current process and domain gauges
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /catalog/summary:
    get:
      operationId: getCatalogSummary
      summary: Get canonical domain counts and closure invariants
      responses:
        '200':
          description: Current derived catalog summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSummary'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /applicability-findings.csv:
    get:
      operationId: exportApplicabilityFindings
      summary: Export tenant-scoped Finding_ID references for applicability work
      description: >-
        Returns a reference CSV containing the canonical Finding_ID plus asset, CVE,
        product, severity, and current applicability context. Current_* column names are
        deliberate so this reference export cannot masquerade as APPLICABILITY_CSV_V1.
      responses:
        '200':
          description: Finding reference CSV
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /applicability-imports:
    post:
      operationId: importApplicabilityCsv
      summary: Validate and persist APPLICABILITY_CSV_V1 evidence
      description: >-
        Parses the five-column finding-scoped assessment contract and appends safe
        evidence to immutable PostgreSQL history. Unknown findings and persisted
        same-time conflicts are quarantined rather than reassigned or overwritten.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Applicability file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicabilityImportResult'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /cvss-v31-evidence:
    get:
      operationId: listCvssV31Evidence
      summary: Read current CVSS v3.1 Base evidence per source
      description: >-
        Returns the latest observation independently for every CVSS source attached to
        tenant CVEs. The API does not select a winning source or derive priority, risk,
        SLA, EPSS, or KEV conclusions from these records.
      parameters:
        - name: limit
          in: query
          description: Maximum number of current source-evidence rows to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cve
          in: query
          description: Optional case-insensitive CVE identifier or CVE prefix
          schema:
            type: string
            maxLength: 32
            pattern: '^CVE-[0-9A-Za-z-]+$'
      responses:
        '200':
          description: Current tenant-scoped CVSS v3.1 Base evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvssV31EvidencePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /cvss-v31-imports:
    post:
      operationId: importCvssV31Csv
      summary: Validate and persist CVSS_V31_CSV_V1 evidence
      description: >-
        Parses independent CVE-scoped CVSS v3.1 Base evidence and appends safe rows to
        immutable PostgreSQL history. CVEs that are not attached to findings in the
        current tenant and persisted same-source/same-time conflicts are quarantined.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: CVSS v3.1 Base file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvssV31ImportResult'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /cisa-kev-evidence:
    get:
      operationId: listCisaKevEvidence
      summary: Read current snapshot-bound CISA KEV membership evidence per source
      description: >-
        Returns the latest persisted LISTED or NOT_LISTED membership evidence independently
        for every KEV source attached to tenant CVEs. Absence of persisted evidence remains
        UNKNOWN and is not fabricated as a row. NOT_LISTED does not mean safe or not exploited,
        and CISA due dates remain source evidence rather than organizational SLA.
      parameters:
        - name: limit
          in: query
          description: Maximum number of current source-evidence rows to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cve
          in: query
          description: Optional case-insensitive CVE identifier or CVE prefix
          schema:
            type: string
            maxLength: 32
            pattern: '^CVE-[0-9A-Za-z-]+$'
      responses:
        '200':
          description: Current tenant-scoped CISA KEV membership evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CisaKevEvidencePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /cisa-kev-imports:
    post:
      operationId: importCisaKevCsv
      summary: Validate and persist CISA_KEV_CSV_V1 evidence
      description: >-
        Parses snapshot-bound CISA KEV membership evidence and appends safe rows through
        the existing transactional PostgreSQL V11 importer. Snapshot and membership
        conflicts are quarantined; UNKNOWN is represented by absence of usable evidence.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: CISA KEV evidence file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CisaKevImportResult'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /epss-evidence:
    get:
      operationId: listEpssEvidence
      summary: Read current FIRST EPSS probability evidence per source
      description: >-
        Returns the latest published EPSS score independently for every source attached
        to tenant CVEs. Probability and percentile are source evidence, not organizational
        risk or priority. A CVE without persisted EPSS evidence is absent rather than
        fabricated as probability zero. Score date remains distinct from local observation time.
      parameters:
        - name: limit
          in: query
          description: Maximum number of current source-evidence rows to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cve
          in: query
          description: Optional case-insensitive CVE identifier or CVE prefix
          schema:
            type: string
            maxLength: 32
            pattern: '^CVE-[0-9A-Za-z-]+$'
      responses:
        '200':
          description: Current tenant-scoped FIRST EPSS evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpssEvidencePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /epss-imports:
    post:
      operationId: importEpssCsv
      summary: Validate and persist EPSS_CSV_V1 evidence
      description: >-
        Parses independent CVE-scoped FIRST EPSS probability evidence and appends safe
        rows through the transactional PostgreSQL V12 importer. Same-observation snapshot
        conflicts and persisted score conflicts are quarantined rather than overwritten.
        Missing score evidence remains absence and is never converted to probability zero.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: EPSS evidence file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpssImportResult'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /asset-context-evidence:
    get:
      operationId: listAssetContextEvidence
      summary: Read current organizational Asset Context evidence per source
      description: >-
        Returns the latest organizational context observation independently for every
        context source attached to an existing tenant asset. Environment, business service,
        owner, and Business Criticality remain source evidence. This API does not select a
        winning context source or derive criticality weights, reachability, risk, priority,
        SLA, CVSS/KEV/EPSS combinations, or business-loss conclusions.
      parameters:
        - name: limit
          in: query
          description: Maximum number of current source-evidence rows to return
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: asset
          in: query
          description: Optional case-insensitive prefix for observed asset name or source ID
          schema:
            type: string
            maxLength: 160
        - name: sourceProfile
          in: query
          description: Optional exact source-profile external key
          schema:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
        - name: contextSource
          in: query
          description: Optional exact organizational-context source identifier
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Current tenant-scoped per-source organizational Asset Context evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetContextEvidencePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /asset-context-imports:
    post:
      operationId: importAssetContextCsv
      summary: Validate and persist ASSET_CONTEXT_CSV_V1 evidence
      description: >-
        Parses asset-scoped organizational context evidence and appends safe rows through
        the transactional PostgreSQL V13 importer. Rows must resolve to existing canonical
        assets; context import never creates scanner assets. Same-observation source-artifact
        conflicts and persisted evidence conflicts are quarantined rather than overwritten.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Asset Context evidence file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetContextImportResult'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /network-reachability-evidence:
    get:
      operationId: listNetworkReachabilityEvidence
      summary: Read current scoped network reachability evidence per source and endpoint
      description: >-
        Returns latest observations independently per evidence source, origin scope/label,
        transport protocol, and endpoint for already-canonical tenant assets. NOT_REACHABLE
        remains scoped negative evidence; missing rows are not converted to NOT_REACHABLE.
        INTERNET + REACHABLE remains technical endpoint evidence and is not an asset-wide
        exposure verdict, Risk Score, priority, or SLA.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: asset
          in: query
          schema: {type: string, maxLength: 160}
        - name: sourceProfile
          in: query
          schema:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
        - name: evidenceSource
          in: query
          schema: {type: string, maxLength: 256}
        - name: originScope
          in: query
          schema:
            enum: [INTERNET, EXTERNAL_PARTNER, INTERNAL_ENTERPRISE, LOCAL_SEGMENT, OTHER, UNKNOWN]
        - name: reachabilityStatus
          in: query
          schema:
            enum: [REACHABLE, NOT_REACHABLE, UNKNOWN]
      responses:
        '200':
          description: Current tenant-scoped per-source/origin/endpoint reachability evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkReachabilityEvidencePage'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /network-reachability-imports:
    post:
      operationId: importNetworkReachabilityCsv
      summary: Validate and persist NETWORK_REACHABILITY_CSV_V1 evidence
      description: >-
        Parses origin- and endpoint-scoped connectivity evidence and appends safe rows through
        the transactional PostgreSQL V14 importer. Rows must resolve to existing canonical
        assets; reachability import never creates scanner inventory. Source-snapshot or
        persisted scoped-endpoint conflicts are quarantined rather than overwritten.
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
          application/csv:
            schema: {type: string, format: binary}
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Network reachability evidence file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkReachabilityImportResult'
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/InsufficientRole'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /business-impact-evidence:
    get:
      operationId: listBusinessImpactEvidence
      summary: Read current qualitative Business and Mission Impact evidence per source, service, and dimension
      description: >-
        Returns latest source-reported qualitative impact observations independently per
        impact source, normalized Business Service, and impact dimension for already-canonical
        tenant assets. Missing rows remain absence. Impact levels remain source classifications;
        the API does not choose a source winner, derive a numeric weight, aggregate impact score,
        Risk Score, priority, or SLA, or map Asset Context Business Criticality automatically.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: asset
          in: query
          schema: {type: string, maxLength: 160}
        - name: sourceProfile
          in: query
          schema:
            type: string
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
        - name: businessService
          in: query
          schema: {type: string, maxLength: 256}
        - name: impactSource
          in: query
          schema: {type: string, maxLength: 256}
        - name: impactDimension
          in: query
          schema:
            enum: [AVAILABILITY, INTEGRITY, CONFIDENTIALITY, SAFETY, FINANCIAL, REGULATORY, OPERATIONAL, REPUTATIONAL, MISSION, OTHER, UNKNOWN]
        - name: impactLevel
          in: query
          schema:
            enum: [SEVERE, HIGH, MODERATE, LOW, NEGLIGIBLE, UNKNOWN]
      responses:
        '200':
          description: Current tenant-scoped per-source/service/dimension qualitative impact evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessImpactEvidencePage'
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /business-impact-imports:
    post:
      operationId: importBusinessImpactCsv
      summary: Validate and persist BUSINESS_IMPACT_CSV_V1 evidence
      description: >-
        Parses source-reported qualitative Business/Mission Impact evidence and appends safe
        rows through the transactional PostgreSQL V15 importer. Rows must resolve to existing
        canonical assets. Source-snapshot or persisted asset/service/dimension conflicts are
        quarantined rather than overwritten. No numeric impact weighting is introduced.
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
          application/csv:
            schema: {type: string, format: binary}
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Business/Mission Impact evidence file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessImpactImportResult'
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/InsufficientRole'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /cases:
    get:
      operationId: listCases
      summary: Search cases with revision-bound cursor pagination
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding page
          schema:
            type: string
        - name: severity
          in: query
          description: Comma-separated current severities
          schema:
            type: string
            examples: [CRITICAL,HIGH]
        - name: status
          in: query
          description: Comma-separated workflow statuses
          schema:
            type: string
            examples: [OPEN,ACCEPTED_RISK]
        - name: cve
          in: query
          description: Case-insensitive CVE substring
          schema:
            type: string
        - name: asset
          in: query
          description: Case-insensitive asset-name substring
          schema:
            type: string
        - name: priority
          in: query
          description: Comma-separated legacy compatibility priority tiers
          schema:
            type: string
            examples: [IMMEDIATE,URGENT]
        - name: knownExploited
          in: query
          description: Filter by legacy combined CISA KEV evidence
          schema:
            type: boolean
      responses:
        '200':
          description: Stable page for the current catalog revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          description: Cursor belongs to a superseded catalog revision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /cases/{caseId}:
    get:
      operationId: getCase
      summary: Get one case, its exposures, and its workflow audit trail
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /cases/{caseId}/actions:
    post:
      operationId: actOnCase
      summary: Append an idempotent, audited case decision or comment
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum: [ACCEPT_RISK, MARK_FALSE_POSITIVE, CLOSE_MANUAL, REOPEN, COMMENT]
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                expiresAt:
                  description: Required only by ACCEPT_RISK and must be in the future
                  type: string
                  format: date-time
                evidenceReference:
                  description: Required by CLOSE_MANUAL
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Decision committed, or the identical idempotent request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseActionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csv-imports:
    post:
      operationId: createCsvImport
      summary: Stream, validate, and preview a supported Wazuh CSV contract
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceProfileId'
        - $ref: '#/components/parameters/CsvContract'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: CSV validated and preview resource created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '200':
          description: Existing import replayed by idempotency key or file SHA-256
          headers:
            Idempotency-Replayed:
              schema:
                const: 'true'
            RBVM-Replay-Reason:
              schema:
                type: string
                enum: [IDEMPOTENCY_KEY, FILE_SHA256]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csv-imports/{importId}:
    get:
      operationId: getCsvImport
      summary: Get import state, analysis ledger, and preview
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Current import state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csv-imports/{importId}/confirm:
    post:
      operationId: confirmCsvImport
      summary: Materialize validated observations and commit their raw evidence
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Domain materialized or an already completed result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /managed-assets:
    get:
      operationId: listManagedAssets
      summary: List current customer-managed assets
      description: >-
        Returns the latest immutable revision for each tenant-scoped managed asset.
        No lifecycle filter is implicit; lifecycle defaults to ALL. This endpoint does
        not correlate managed assets to scanner identities or derive risk or priority.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: afterId
          in: query
          schema:
            type: string
            format: uuid
        - name: lifecycle
          in: query
          schema:
            type: string
            enum: [ACTIVE, RETIRED, ALL]
            default: ALL
      responses:
        '200':
          description: Current managed-asset page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAssetPage'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createManagedAsset
      summary: Create a customer-managed asset
      description: >-
        Creates an ACTIVE revision 1. The server generates the RBVM managed-asset UUID
        and derives audit identity from the authenticated principal. customerAssetKey,
        when supplied, is immutable customer/CMDB identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedAssetRequest'
      responses:
        '201':
          description: Managed asset created
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAsset'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/InsufficientRole' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }

  /managed-assets/{managedAssetId}:
    parameters:
      - $ref: '#/components/parameters/ManagedAssetId'
    get:
      operationId: getManagedAsset
      summary: Read the current managed-asset representation
      responses:
        '200':
          description: Current managed asset
          headers:
            ETag:
              description: Strong validator for the current immutable revision
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAsset'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }

  /managed-assets/{managedAssetId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ManagedAssetId'
    get:
      operationId: listManagedAssetRevisions
      summary: Read immutable managed-asset revision history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: beforeRevision
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Managed-asset revision page, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAssetRevisionPage'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: appendManagedAssetRevision
      summary: Append one customer-managed asset revision
      description: >-
        Requires the strong ETag from a prior current-state response in If-Match.
        The body is a complete customer state, not a partial patch. Retirement and
        reactivation are represented by RETIRED or ACTIVE lifecycle revisions.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Strong managed-asset ETag returned by a prior current-state response
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendManagedAssetRevisionRequest'
      responses:
        '200':
          description: Revision appended or exact request replayed
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAsset'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/InsufficientRole' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }
  /scanner-assets:
    get:
      operationId: listScannerAssetsForManagedAssetLinks
      summary: List scanner assets with current explicit managed-asset link state
      description: >-
        Lists tenant-scoped canonical scanner identities and the latest explicit link decision, if any.
        Missing currentLink means never assessed and is distinct from an explicit UNLINKED decision.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: afterId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Scanner-asset page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScannerAssetPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }

  /scanner-assets/{scannerAssetId}/managed-asset-link:
    parameters:
      - $ref: '#/components/parameters/ScannerAssetId'
    get:
      operationId: getScannerManagedAssetLink
      summary: Read the current explicit scanner-to-managed-asset link decision
      description: >-
        Returns currentLink null with a deterministic strong revision-0 ETag when the scanner asset
        exists but has never had a link decision. An explicit UNLINKED revision is returned as evidence.
      responses:
        '200':
          description: Current explicit link state
          headers:
            ETag:
              description: Strong validator for current link state, including never-assessed revision 0
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScannerManagedAssetLinkCurrent' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }

  /scanner-assets/{scannerAssetId}/managed-asset-link/revisions:
    parameters:
      - $ref: '#/components/parameters/ScannerAssetId'
    get:
      operationId: listScannerManagedAssetLinkRevisions
      summary: Read immutable explicit link-decision history
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: beforeRevision
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Link-decision history page, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScannerManagedAssetLinkHistoryPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: appendScannerManagedAssetLinkRevision
      summary: Append one explicit customer-confirmed link decision
      description: >-
        Requires exactly one strong If-Match validator from the current-state endpoint. The body is
        complete link state. There is no inferred matching, partial PATCH, DELETE, or automatic merge.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScannerManagedAssetLinkRevisionRequest' }
      responses:
        '200':
          description: Link decision appended or exact request replayed
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScannerManagedAssetLinkCurrent' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/InsufficientRole' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-api-key
      description: >-
        API key supplied as an opaque bearer token; only its SHA-256 digest is stored.
        Registry entries may include an optional ISO-8601 expiration timestamp.
  parameters:
    ScannerAssetId:
      name: scannerAssetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ManagedAssetId:
      name: managedAssetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    SourceProfileId:
      name: X-Source-Profile-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsvContract:
      name: X-CSV-Contract
      in: header
      required: false
      description: Opt in to V2; omitted requests retain V1 compatibility
      schema:
        type: string
        enum: [WAZUH_CSV_V1, WAZUH_CSV_V2]
        default: WAZUH_CSV_V1
  schemas:
    Probe:
      type: object
      required: [status, checkedAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        checkedAt:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
        - supportedContractIds
        - defaultContractId
        - catalogBackend
        - canonicalProjection
        - applicability
        - cvssV31
        - cisaKev
        - epss
        - assetContext
        - networkReachability
        - businessImpact
        - managedAssets
        - scannerManagedAssetLinks
        - storedImports
        - recoveryWarningCount
        - maximumUploadBytes
        - materializedImports
        - observations
        - cases
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        supportedContractIds:
          type: array
          items:
            enum: [WAZUH_CSV_V1, WAZUH_CSV_V2]
        defaultContractId:
          const: WAZUH_CSV_V1
        catalogBackend:
          type: string
          enum: [LOCAL_MEMORY_REBUILD, POSTGRESQL]
        canonicalProjection:
          $ref: '#/components/schemas/CanonicalProjectionHealth'
        applicability:
          $ref: '#/components/schemas/ApplicabilityCapability'
        cvssV31:
          $ref: '#/components/schemas/CvssV31Capability'
        cisaKev:
          $ref: '#/components/schemas/CisaKevCapability'
        epss:
          $ref: '#/components/schemas/EpssCapability'
        assetContext:
          $ref: '#/components/schemas/AssetContextCapability'
        networkReachability:
          $ref: '#/components/schemas/NetworkReachabilityCapability'
        businessImpact:
          $ref: '#/components/schemas/BusinessImpactCapability'
        managedAssets:
          $ref: '#/components/schemas/ManagedAssetCapability'
        scannerManagedAssetLinks:
          $ref: '#/components/schemas/ScannerManagedAssetLinkCapability'
        storedImports:
          type: integer
          minimum: 0
        recoveryWarningCount:
          type: integer
          minimum: 0
        maximumUploadBytes:
          type: integer
          format: int64
          minimum: 1
        materializedImports:
          type: integer
          minimum: 0
        observations:
          type: integer
          minimum: 0
        cases:
          type: integer
          minimum: 0
    ApplicabilityCapability:
      type: object
      additionalProperties: false
      required: [importEnabled, findingReferenceExportEnabled]
      properties:
        importEnabled:
          type: boolean
        findingReferenceExportEnabled:
          type: boolean
    CvssV31Capability:
      type: object
      additionalProperties: false
      required: [importEnabled, evidenceReadEnabled]
      properties:
        importEnabled:
          type: boolean
        evidenceReadEnabled:
          type: boolean
    CisaKevCapability:
      type: object
      additionalProperties: false
      required: [importEnabled, evidenceReadEnabled]
      properties:
        importEnabled:
          type: boolean
        evidenceReadEnabled:
          type: boolean
    EpssCapability:
      type: object
      additionalProperties: false
      required: [importEnabled, evidenceReadEnabled]
      properties:
        importEnabled:
          type: boolean
        evidenceReadEnabled:
          type: boolean
    AssetContextCapability:
      type: object
      additionalProperties: false
      required: [importEnabled, evidenceReadEnabled]
      properties:
        importEnabled:
          type: boolean
        evidenceReadEnabled:
          type: boolean
    NetworkReachabilityCapability:
      type: object
      additionalProperties: false
      required: [importEnabled, evidenceReadEnabled]
      properties:
        importEnabled: {type: boolean}
        evidenceReadEnabled: {type: boolean}
    BusinessImpactCapability:
      type: object
      additionalProperties: false
      required: [importEnabled, evidenceReadEnabled]
      properties:
        importEnabled: {type: boolean}
        evidenceReadEnabled: {type: boolean}
    ManagedAssetCapability:
      type: object
      additionalProperties: false
      required: [readEnabled, writeEnabled, historyReadEnabled]
      properties:
        readEnabled: { type: boolean }
        writeEnabled: { type: boolean }
        historyReadEnabled: { type: boolean }

    ScannerManagedAssetLinkCapability:
      type: object
      additionalProperties: false
      required: [readEnabled, writeEnabled, historyReadEnabled]
      properties:
        readEnabled: { type: boolean }
        writeEnabled: { type: boolean }
        historyReadEnabled: { type: boolean }

    ScannerManagedAssetLinkStatus:
      type: string
      enum: [LINKED, UNLINKED]

    ScannerManagedAssetLinkEvent:
      type: object
      additionalProperties: false
      required: [eventId, scannerAssetId, revision, linkStatus, managedAssetId, linkMethod, evidenceSha256, changedBy, changeNote, recordedAt]
      properties:
        eventId: { type: string, format: uuid }
        scannerAssetId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        linkStatus: { $ref: '#/components/schemas/ScannerManagedAssetLinkStatus' }
        managedAssetId: { type: [string, 'null'], format: uuid }
        linkMethod: { const: CUSTOMER_CONFIRMED }
        evidenceSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        changedBy: { type: string, minLength: 1 }
        changeNote: { type: string }
        recordedAt: { type: string, format: date-time }

    ScannerAssetSummary:
      type: object
      additionalProperties: false
      required: [id, observedName, osNameRaw, sourceProfileKey, identityBasis, identityConfidence, firstObservedAt, lastObservedAt, currentLink]
      properties:
        id: { type: string, format: uuid }
        observedName: { type: string, minLength: 1 }
        osNameRaw: { type: string }
        sourceProfileKey: { type: string, minLength: 1 }
        identityBasis: { const: SOURCE_NAME_ONLY }
        identityConfidence: { const: LOW }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
        currentLink:
          oneOf:
            - $ref: '#/components/schemas/ScannerManagedAssetLinkEvent'
            - type: 'null'

    ScannerAssetPage:
      type: object
      additionalProperties: false
      required: [assets, nextAfterId]
      properties:
        assets:
          type: array
          items: { $ref: '#/components/schemas/ScannerAssetSummary' }
        nextAfterId: { type: [string, 'null'], format: uuid }

    ScannerManagedAssetLinkCurrent:
      type: object
      additionalProperties: false
      required: [scannerAssetId, currentLink]
      properties:
        scannerAssetId: { type: string, format: uuid }
        currentLink:
          oneOf:
            - $ref: '#/components/schemas/ScannerManagedAssetLinkEvent'
            - type: 'null'

    ScannerManagedAssetLinkHistoryPage:
      type: object
      additionalProperties: false
      required: [scannerAssetId, events, nextBeforeRevision]
      properties:
        scannerAssetId: { type: string, format: uuid }
        events:
          type: array
          items: { $ref: '#/components/schemas/ScannerManagedAssetLinkEvent' }
        nextBeforeRevision: { type: [integer, 'null'], minimum: 1 }

    ScannerManagedAssetLinkRevisionRequest:
      type: object
      additionalProperties: false
      required: [linkStatus]
      allOf:
        - if:
            properties: { linkStatus: { const: LINKED } }
            required: [linkStatus]
          then:
            required: [managedAssetId]
            properties:
              managedAssetId: { type: string, format: uuid }
        - if:
            properties: { linkStatus: { const: UNLINKED } }
            required: [linkStatus]
          then:
            properties:
              managedAssetId: { type: 'null' }
      properties:
        linkStatus: { $ref: '#/components/schemas/ScannerManagedAssetLinkStatus' }
        managedAssetId: { type: [string, 'null'], format: uuid }
        changeNote: { type: [string, 'null'] }

    ManagedAssetEnvironment:
      type: string
      enum: [PRODUCTION, PRE_PRODUCTION, DEVELOPMENT, TEST, SANDBOX, DISASTER_RECOVERY, UNKNOWN]
    ManagedAssetBusinessCriticality:
      type: string
      enum: [MISSION_CRITICAL, HIGH, MODERATE, LOW, UNKNOWN]
    ManagedAssetClassificationMethod:
      type: string
      enum: [CUSTOMER_DIRECT, GUIDED]
    ManagedAssetLifecycleStatus:
      type: string
      enum: [ACTIVE, RETIRED]

    CreateManagedAssetRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
        - environment
        - businessService
        - businessOwner
        - businessCriticality
        - classificationMethod
      allOf:
        - if:
            properties:
              classificationMethod: { const: GUIDED }
            required: [classificationMethod]
          then:
            required: [guideContractId, guideRevision]
            properties:
              guideContractId: { type: string, minLength: 1 }
              guideRevision: { type: integer, minimum: 1 }
        - if:
            properties:
              classificationMethod: { const: CUSTOMER_DIRECT }
            required: [classificationMethod]
          then:
            properties:
              guideContractId: { type: 'null' }
              guideRevision: { type: 'null' }
      properties:
        customerAssetKey:
          type: [string, 'null']
        displayName: { type: string, minLength: 1 }
        environment: { $ref: '#/components/schemas/ManagedAssetEnvironment' }
        businessService: { type: string, minLength: 1 }
        businessOwner: { type: string, minLength: 1 }
        businessCriticality: { $ref: '#/components/schemas/ManagedAssetBusinessCriticality' }
        classificationMethod: { $ref: '#/components/schemas/ManagedAssetClassificationMethod' }
        guideContractId:
          type: [string, 'null']
        guideRevision:
          type: [integer, 'null']
          minimum: 1
        changeNote:
          type: [string, 'null']

    AppendManagedAssetRevisionRequest:
      type: object
      additionalProperties: false
      required:
        - lifecycleStatus
        - displayName
        - environment
        - businessService
        - businessOwner
        - businessCriticality
        - classificationMethod
      allOf:
        - if:
            properties:
              classificationMethod: { const: GUIDED }
            required: [classificationMethod]
          then:
            required: [guideContractId, guideRevision]
            properties:
              guideContractId: { type: string, minLength: 1 }
              guideRevision: { type: integer, minimum: 1 }
        - if:
            properties:
              classificationMethod: { const: CUSTOMER_DIRECT }
            required: [classificationMethod]
          then:
            properties:
              guideContractId: { type: 'null' }
              guideRevision: { type: 'null' }
      properties:
        lifecycleStatus: { $ref: '#/components/schemas/ManagedAssetLifecycleStatus' }
        displayName: { type: string, minLength: 1 }
        environment: { $ref: '#/components/schemas/ManagedAssetEnvironment' }
        businessService: { type: string, minLength: 1 }
        businessOwner: { type: string, minLength: 1 }
        businessCriticality: { $ref: '#/components/schemas/ManagedAssetBusinessCriticality' }
        classificationMethod: { $ref: '#/components/schemas/ManagedAssetClassificationMethod' }
        guideContractId:

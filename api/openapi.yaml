openapi: 3.1.1
info:
  title: RBVM CSV Import API
  version: 0.12.0
  description: >-
    Synchronous upload, validation, preview, and canonical-domain materialization
    API for WAZUH_CSV_V1 positive observations and opt-in WAZUH_CSV_V2 explicit
    finding lifecycle evidence, including separate finding-scoped applicability
    assessment import, explicit case decisions, an append-only workflow audit trail,
    and optional health visibility for a synchronous PostgreSQL canonical projection.
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service and recovery state
      responses:
        '200':
          description: Current service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /live:
    get:
      security: []
      operationId: getLiveness
      summary: Check whether the HTTP process is running
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                required: [status, startedAt]
                properties:
                  status:
                    const: UP
                  startedAt:
                    type: string
                    format: date-time
  /ready:
    get:
      security: []
      operationId: getReadiness
      summary: Check database and projection readiness
      responses:
        '200':
          description: Service dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
        '503':
          description: A required dependency is unavailable or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
  /metrics:
    get:
      operationId: getMetrics
      summary: Read Prometheus-compatible operational metrics
      responses:
        '200':
          description: Current process and domain gauges
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /catalog/summary:
    get:
      operationId: getCatalogSummary
      summary: Get canonical domain counts and closure invariants
      responses:
        '200':
          description: Current derived catalog summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSummary'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /applicability-findings.csv:
    get:
      operationId: exportApplicabilityFindings
      summary: Export tenant-scoped Finding_ID references for applicability work
      description: >-
        Returns a reference CSV containing the canonical Finding_ID plus asset, CVE,
        product, severity, and current applicability context. Current_* column names are
        deliberate so this reference export cannot masquerade as APPLICABILITY_CSV_V1.
      responses:
        '200':
          description: Finding reference CSV
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /applicability-imports:
    post:
      operationId: importApplicabilityCsv
      summary: Validate and persist APPLICABILITY_CSV_V1 evidence
      description: >-
        Parses the five-column finding-scoped assessment contract and appends safe
        evidence to immutable PostgreSQL history. Unknown findings and persisted
        same-time conflicts are quarantined rather than reassigned or overwritten.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Applicability file processed transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicabilityImportResult'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
  /cases:
    get:
      operationId: listCases
      summary: Search cases with revision-bound cursor pagination
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor returned by the preceding page
          schema:
            type: string
        - name: severity
          in: query
          description: Comma-separated current severities
          schema:
            type: string
            examples: [CRITICAL,HIGH]
        - name: status
          in: query
          description: Comma-separated workflow statuses
          schema:
            type: string
            examples: [OPEN,ACCEPTED_RISK]
        - name: cve
          in: query
          description: Case-insensitive CVE substring
          schema:
            type: string
        - name: asset
          in: query
          description: Case-insensitive asset-name substring
          schema:
            type: string
        - name: priority
          in: query
          description: Comma-separated vulnerability priority tiers
          schema:
            type: string
            examples: [IMMEDIATE,URGENT]
        - name: knownExploited
          in: query
          description: Filter by CISA KEV evidence
          schema:
            type: boolean
      responses:
        '200':
          description: Stable page for the current catalog revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '409':
          description: Cursor belongs to a superseded catalog revision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /cases/{caseId}:
    get:
      operationId: getCase
      summary: Get one case, its exposures, and its workflow audit trail
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /cases/{caseId}/actions:
    post:
      operationId: actOnCase
      summary: Append an idempotent, audited case decision or comment
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action, reason]
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum: [ACCEPT_RISK, MARK_FALSE_POSITIVE, CLOSE_MANUAL, REOPEN, COMMENT]
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                expiresAt:
                  description: Required only by ACCEPT_RISK and must be in the future
                  type: string
                  format: date-time
                evidenceReference:
                  description: Required by CLOSE_MANUAL
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Decision committed, or the identical idempotent request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseActionResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csv-imports:
    post:
      operationId: createCsvImport
      summary: Stream, validate, and preview a supported Wazuh CSV contract
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceProfileId'
        - $ref: '#/components/parameters/CsvContract'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/csv:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: CSV validated and preview resource created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '200':
          description: Existing import replayed by idempotency key or file SHA-256
          headers:
            Idempotency-Replayed:
              schema:
                const: 'true'
            RBVM-Replay-Reason:
              schema:
                type: string
                enum: [IDEMPOTENCY_KEY, FILE_SHA256]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csv-imports/{importId}:
    get:
      operationId: getCsvImport
      summary: Get import state, analysis ledger, and preview
      parameters:
        - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Current import state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /csv-imports/{importId}/confirm:
    post:
      operationId: confirmCsvImport
      summary: Materialize validated observations and commit their raw evidence
      parameters:
        - $ref: '#/components/parameters/ImportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Domain materialized or an already completed result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportRun'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientRole'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-api-key
      description: >-
        API key supplied as an opaque bearer token; only its SHA-256 digest is stored.
        Registry entries may include an optional ISO-8601 expiration timestamp.
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    SourceProfileId:
      name: X-Source-Profile-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CsvContract:
      name: X-CSV-Contract
      in: header
      required: false
      description: Opt in to V2; omitted requests retain V1 compatibility
      schema:
        type: string
        enum: [WAZUH_CSV_V1, WAZUH_CSV_V2]
        default: WAZUH_CSV_V1
  schemas:
    Probe:
      type: object
      required: [status, checkedAt]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        checkedAt:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
        - supportedContractIds
        - defaultContractId
        - catalogBackend
        - canonicalProjection
        - applicability
        - storedImports
        - recoveryWarningCount
        - maximumUploadBytes
        - materializedImports
        - observations
        - cases
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        supportedContractIds:
          type: array
          items:
            enum: [WAZUH_CSV_V1, WAZUH_CSV_V2]
        defaultContractId:
          const: WAZUH_CSV_V1
        catalogBackend:
          type: string
          enum: [LOCAL_MEMORY_REBUILD, POSTGRESQL]
        canonicalProjection:
          $ref: '#/components/schemas/CanonicalProjectionHealth'
        applicability:
          $ref: '#/components/schemas/ApplicabilityCapability'
        storedImports:
          type: integer
          minimum: 0
        recoveryWarningCount:
          type: integer
          minimum: 0
        maximumUploadBytes:
          type: integer
          format: int64
          minimum: 1
        materializedImports:
          type: integer
          minimum: 0
        observations:
          type: integer
          minimum: 0
        cases:
          type: integer
          minimum: 0
    ApplicabilityCapability:
      type: object
      additionalProperties: false
      required: [importEnabled, findingReferenceExportEnabled]
      properties:
        importEnabled:
          type: boolean
        findingReferenceExportEnabled:
          type: boolean
    CanonicalProjectionHealth:
      type: object
      required: [backend, status]
      properties:
        backend:
          type: string
          enum: [DISABLED, POSTGRESQL]
        status:
          type: string
          enum: [NOT_CONFIGURED, UP, DEGRADED, DOWN]
        schemaVersion:
          type: integer
          minimum: 1
        materializedImports:
          type: [integer, 'null']
          format: int64
          minimum: 0
        reconciliationIssues:
          type: [integer, 'null']
          format: int64
          minimum: 0
        lastSynchronizedAt:
          type: [string, 'null']
          format: date-time
        lastFailure:
          type: [string, 'null']
    CsvImportRun:
      type: object
      required:
        - importId
        - tenantId
        - sourceProfileId
        - contractId
        - semantics
        - commitScope
        - status
        - createdAt
        - fileSha256
        - analysis
        - rawEvidence
      properties:
        importId:
          type: string
          format: uuid
        tenantId:
          const: local
        sourceProfileId:
          type: string
        contractId:
          enum: [WAZUH_CSV_V1, WAZUH_CSV_V2]
        semantics:
          enum: [POSITIVE_OBSERVATION_EXPORT, EXPLICIT_FINDING_LIFECYCLE_EXPORT]
        commitScope:
          const: CANONICAL_DOMAIN_AND_RAW_EVIDENCE
        status:
          $ref: '#/components/schemas/CsvImportStatus'
        createdAt:
          type: string
          format: date-time
        fileSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        terminalReason:
          type: [string, 'null']
        analysis:
          $ref: '#/components/schemas/AnalysisReport'
        materialization:
          oneOf:
            - $ref: '#/components/schemas/DomainMaterialization'
            - type: 'null'
        rawEvidence:
          type: object
          required: [stored, relativePath]
          properties:
            stored:
              type: boolean
            relativePath:
              type: string
    CsvImportStatus:
      type: string
      enum:
        - UPLOADED
        - VALIDATING
        - PREVIEW_READY
        - IMPORTING
        - RECONCILING
        - COMPLETED
        - PARTIAL
        - REJECTED
        - FAILED
    AnalysisReport:
      type: object
      required:
        - contractId
        - semantics
        - file
        - schema
        - ledger
        - identity
        - severityDistribution
        - time
        - quality
        - preview
      properties:
        contractId:
          enum: [WAZUH_CSV_V1, WAZUH_CSV_V2]
        semantics:
          enum: [POSITIVE_OBSERVATION_EXPORT, EXPLICIT_FINDING_LIFECYCLE_EXPORT]
        file:
          type: object
          required: [sizeBytes, sha256]
          properties:
            sizeBytes:
              type: integer
              format: int64
            sha256:
              type: string
        schema:
          type: object
          additionalProperties: true
        ledger:
          $ref: '#/components/schemas/ImportLedger'
        identity:
          $ref: '#/components/schemas/IdentityLedger'
        severityDistribution:
          type: object
          required: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        time:
          type: object
          additionalProperties: true
        quality:
          type: object
          additionalProperties: true
        preview:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true
    ImportLedger:
      type: object
      required: [logicalRows, acceptedRows, deduplicatedRows, quarantinedRows, activeRows, resolvedRows]
      properties:
        logicalRows:
          type: integer
          format: int64
          minimum: 0
        acceptedRows:
          type: integer
          format: int64
          minimum: 0
        deduplicatedRows:
          type: integer
          format: int64
          minimum: 0
        quarantinedRows:
          type: integer
          format: int64
          minimum: 0
        activeRows:
          type: integer
          format: int64
          minimum: 0
        resolvedRows:
          type: integer
          format: int64
          minimum: 0
    IdentityLedger:
      type: object
      additionalProperties:
        type: integer
        format: int64
        minimum: 0
    DomainMaterialization:
      type: object
      required:
        - importId
        - replayed
        - acceptedObservations
        - insertedObservations
        - duplicateObservations
        - newAssets
        - newVulnerabilities
        - newComponents
        - newExposures
        - updatedExposures
        - newCases
        - updatedCases
        - materializedAt
      properties:
        importId:
          type: string
          format: uuid
        replayed:
          type: boolean
        acceptedObservations:
          type: integer
          format: int64
        insertedObservations:
          type: integer
          format: int64
        duplicateObservations:
          type: integer
          format: int64
        newAssets:
          type: integer
          format: int64
        newVulnerabilities:
          type: integer
          format: int64
        newComponents:
          type: integer
          format: int64
        newExposures:
          type: integer
          format: int64
        updatedExposures:
          type: integer
          format: int64
        newCases:
          type: integer
          format: int64
        updatedCases:
          type: integer
          format: int64
        materializedAt:
          type: string
          format: date-time
    CatalogSummary:
      type: object
      required:
        - materializedImports
        - observations
        - importObservationLinks
        - assets
        - vulnerabilities
        - components
        - exposures
        - cases
        - openCases
        - autoClosedCases
        - sourceResolvedCases
        - exposuresWithSeverityChanges
        - exposuresWithTimestampConflicts
        - currentCaseSeverityDistribution
        - caseStatusDistribution
        - closurePolicy
        - vulnerabilityIntelligence
      properties:
        materializedImports:
          type: integer
          format: int64
        observations:
          type: integer
          format: int64
        importObservationLinks:
          type: integer
          format: int64
        assets:
          type: integer
          format: int64
        vulnerabilities:
          type: integer
          format: int64
        components:
          type: integer
          format: int64
        exposures:
          type: integer
          format: int64
        cases:
          type: integer
          format: int64
        openCases:
          type: integer
          format: int64
        autoClosedCases:
          type: integer
          format: int64
          minimum: 0
          deprecated: true
          description: Compatibility alias for sourceResolvedCases
        sourceResolvedCases:
          type: integer
          format: int64
          minimum: 0
        exposuresWithSeverityChanges:
          type: integer
          format: int64
        exposuresWithTimestampConflicts:
          type: integer
          format: int64
        currentCaseSeverityDistribution:
          type: object
          additionalProperties:
            type: integer
            format: int64
        caseStatusDistribution:
          type: object
          required: [OPEN, SOURCE_RESOLVED, ACCEPTED_RISK, FALSE_POSITIVE, CLOSED_MANUAL]
          properties:
            OPEN:
              type: integer
              format: int64
              minimum: 0
            SOURCE_RESOLVED:
              type: integer
              format: int64
              minimum: 0
            ACCEPTED_RISK:
              type: integer
              format: int64
              minimum: 0
            FALSE_POSITIVE:
              type: integer
              format: int64
              minimum: 0
            CLOSED_MANUAL:
              type: integer
              format: int64
              minimum: 0
        vulnerabilityIntelligence:
          $ref: '#/components/schemas/VulnerabilityIntelligenceSummary'
        closurePolicy:
          const: EXPLICIT_SOURCE_EVIDENCE_ONLY_NO_ABSENCE_CLOSE
    VulnerabilityIntelligenceSummary:
      type: object
      required:
        - freshnessWindowHours
        - enrichedVulnerabilities
        - unenrichedVulnerabilities
        - staleVulnerabilities
        - knownExploitedVulnerabilities
        - oldestObservedAt
        - newestObservedAt
        - priorityDistribution
      properties:
        freshnessWindowHours:
          type: integer
          format: int64
          const: 168
        enrichedVulnerabilities:
          type: integer
          format: int64
          minimum: 0
        unenrichedVulnerabilities:
          type: integer
          format: int64
          minimum: 0
        staleVulnerabilities:
          description: Enriched vulnerabilities whose current evidence is older than seven days
          type: integer
          format: int64
          minimum: 0
        knownExploitedVulnerabilities:
          type: integer
          format: int64
          minimum: 0
        oldestObservedAt:
          type: [string, 'null']
          format: date-time
        newestObservedAt:
          type: [string, 'null']
          format: date-time
        priorityDistribution:
          type: object
          required: [UNENRICHED, STANDARD, HIGH, URGENT, IMMEDIATE]
          properties:
            UNENRICHED: {type: integer, format: int64, minimum: 0}
            STANDARD: {type: integer, format: int64, minimum: 0}
            HIGH: {type: integer, format: int64, minimum: 0}
            URGENT: {type: integer, format: int64, minimum: 0}
            IMMEDIATE: {type: integer, format: int64, minimum: 0}
    CasePage:
      type: object
      required: [catalogRevision, summary, cases, nextCursor]
      properties:
        catalogRevision:
          type: integer
          format: int64
          minimum: 0
        summary:
          $ref: '#/components/schemas/CatalogSummary'
        cases:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CaseView'
        nextCursor:
          type: [string, 'null']
    CaseView:
      type: object
      required:
        - caseId
        - assetId
        - assetName
        - osName
        - sourceProfileId
        - cveId
        - status
        - currentSeverity
        - firstObservedAt
        - lastObservedAt
        - exposureCount
        - workflowVersion
        - riskAcceptedUntil
        - riskAcceptanceExpired
        - decisionReason
        - decisionEvidence
        - lastWorkflowAt
        - closurePolicy
      properties:
        caseId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        assetId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        assetName:
          type: string
        osName:
          type: string
        sourceProfileId:
          type: string
        cveId:
          type: string
        status:
          type: string
          enum: [OPEN, SOURCE_RESOLVED, ACCEPTED_RISK, FALSE_POSITIVE, CLOSED_MANUAL]
        currentSeverity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        exposureCount:
          type: integer
          minimum: 1
        workflowVersion:
          type: integer
          format: int64
          minimum: 0
        riskAcceptedUntil:
          type: [string, 'null']
          format: date-time
        riskAcceptanceExpired:
          type: boolean
          description: Informational flag; expiry never silently changes workflow state
        decisionReason:
          type: [string, 'null']
        decisionEvidence:
          type: [string, 'null']
        lastWorkflowAt:
          type: [string, 'null']
          format: date-time
        closurePolicy:
          enum: [POSITIVE_ONLY_NO_AUTO_CLOSE, EXPLICIT_SOURCE_EVIDENCE_ONLY]
        vulnerabilityIntelligence:
          oneOf:
            - $ref: '#/components/schemas/VulnerabilityIntelligence'
            - type: 'null'
    VulnerabilityIntelligence:
      type: object
      required:
        - priorityTier
        - cvssVersion
        - cvssBaseScore
        - cvssVector
        - epssProbability
        - epssPercentile
        - knownExploited
        - kevDateAdded
        - kevDueDate
        - observedAt
        - sourceReferences
      properties:
        priorityTier:
          enum: [STANDARD, HIGH, URGENT, IMMEDIATE]
        cvssVersion:
          type: [string, 'null']
        cvssBaseScore:
          type: [number, 'null']
          minimum: 0
          maximum: 10
        cvssVector:
          type: [string, 'null']
        epssProbability:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        epssPercentile:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        knownExploited:
          type: [boolean, 'null']
        kevDateAdded:
          type: [string, 'null']
          format: date
        kevDueDate:
          type: [string, 'null']
          format: date
        observedAt:
          type: string
          format: date-time
        sourceReferences:
          type: string
    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseView'
        - type: object
          required: [description, exposures, auditEvents]
          properties:
            description:
              type: string
            exposures:
              type: array
              items:
                $ref: '#/components/schemas/ExposureView'
            auditEvents:
              type: array
              items:
                $ref: '#/components/schemas/CaseAuditEvent'
    ExposureView:
      type: object
      required:
        - exposureId
        - assetId
        - componentId
        - cveId
        - product
        - versionStatus
        - packageVersion
        - packageArchitecture
        - status
        - currentSeverity
        - currentSeverityObservedAt
        - firstObservedAt
        - lastObservedAt
        - observationCount
        - severityChanged
        - timestampSeverityConflict
        - closurePolicy
        - lifecycleObservedAt
        - resolvedAt
      properties:
        exposureId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        assetId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        componentId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        cveId:
          type: string
        product:
          type: string
        versionStatus:
          enum: [UNKNOWN_FROM_SOURCE, OBSERVED_FROM_SOURCE]
        packageVersion:
          type: string
        packageArchitecture:
          type: string
        status:
          enum: [ACTIVE, RESOLVED]
        currentSeverity:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
        currentSeverityObservedAt:
          type: string
          format: date-time
        firstObservedAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        observationCount:
          type: integer
          format: int64
          minimum: 1
        severityChanged:
          type: boolean
        timestampSeverityConflict:
          type: boolean
        closurePolicy:
          enum: [POSITIVE_ONLY_NO_AUTO_CLOSE, EXPLICIT_SOURCE_EVIDENCE_ONLY]
        lifecycleObservedAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time
    ApplicabilityImportResult:
      type: object
      additionalProperties: false
      required:
        - contractId
        - semantics
        - logicalRows
        - acceptedRows
        - insertedAssessments
        - replayedAssessments
        - contractDeduplicatedRows
        - persistenceQuarantinedRows
        - contractQuarantinedRows
        - totalDeduplicatedRows
        - totalQuarantinedRows
        - statusDistribution
        - contractIssues
        - persistenceIssues
      properties:
        contractId:
          const: APPLICABILITY_CSV_V1
        semantics:
          const: FINDING_SCOPED_EXPLICIT_ASSESSMENT
        logicalRows:
          type: integer
          format: int64
          minimum: 0
        acceptedRows:
          type: integer
          format: int64
          minimum: 0
        insertedAssessments:
          type: integer
          format: int64
          minimum: 0
        replayedAssessments:
          type: integer
          format: int64
          minimum: 0
        contractDeduplicatedRows:
          type: integer
          format: int64
          minimum: 0
        persistenceQuarantinedRows:
          type: integer
          format: int64
          minimum: 0
        contractQuarantinedRows:
          type: integer
          format: int64
          minimum: 0
        totalDeduplicatedRows:
          type: integer
          format: int64
          minimum: 0
        totalQuarantinedRows:
          type: integer
          format: int64
          minimum: 0
        statusDistribution:
          type: object
          required: [APPLICABLE, NOT_APPLICABLE, UNKNOWN]
          properties:
            APPLICABLE: {type: integer, format: int64, minimum: 0}
            NOT_APPLICABLE: {type: integer, format: int64, minimum: 0}
            UNKNOWN: {type: integer, format: int64, minimum: 0}
        contractIssues:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApplicabilityIssue'
        persistenceIssues:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ApplicabilityIssue'
    ApplicabilityIssue:
      type: object
      additionalProperties: false
      required: [rowNumber, level, code, message]
      properties:
        rowNumber:
          type: integer
          format: int64
          minimum: 1
        level:
          enum: [WARNING, ERROR]
        code:
          type: string
        message:
          type: string
    CaseAuditEvent:
      type: object
      required:
        - sequence
        - eventId
        - caseId
        - caseVersion
        - action
        - fromStatus
        - toStatus
        - reason
        - expiresAt
        - evidenceReference
        - actorId
        - actorAssurance
        - occurredAt
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        eventId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        caseId:
          type: string
          pattern: '^[a-f0-9]{64}$'
        caseVersion:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [ACCEPT_RISK, MARK_FALSE_POSITIVE, CLOSE_MANUAL, REOPEN, COMMENT]
        fromStatus:
          type: string
          enum: [OPEN, SOURCE_RESOLVED, ACCEPTED_RISK, FALSE_POSITIVE, CLOSED_MANUAL]
        toStatus:
          type: string
          enum: [OPEN, SOURCE_RESOLVED, ACCEPTED_RISK, FALSE_POSITIVE, CLOSED_MANUAL]
        reason:
          type: string
        expiresAt:
          type: [string, 'null']
          format: date-time
        evidenceReference:
          type: [string, 'null']
        actorId:
          type: string
        actorAssurance:
          type: string
        occurredAt:
          type: string
          format: date-time
    CaseActionResult:
      type: object
      required: [replayed, case, auditEvent]
      properties:
        replayed:
          type: boolean
        case:
          $ref: '#/components/schemas/CaseDetail'
        auditEvent:
          $ref: '#/components/schemas/CaseAuditEvent'
    Problem:
      type: object
      required: [type, title, status, detail, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
  responses:
    AuthenticationRequired:
      description: Missing, expired, or invalid bearer API key
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InsufficientRole:
      description: Authenticated identity lacks the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Per-actor or failed-authentication request limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Request could not be completed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

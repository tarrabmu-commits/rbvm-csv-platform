name: formula-ui-bootstrap

on:
  push:
    branches:
      - frontend/rbvm-formula-v1-presentation-v1

permissions:
  contents: write

jobs:
  patch-shared-host:
    if: ${{ !contains(github.event.head_commit.message, 'Add replay-verified Formula V1 browser presentation') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: frontend/rbvm-formula-v1-presentation-v1
      - name: Patch shared Frontend V2 hosts byte-exactly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          module = base64.b64decode("").decode('utf-8')
          anchor = '  <script src="/ui/rbvm-ui.js" defer></script>\n'
          source = Path('src/main/resources/web/index.html').read_text(encoding='utf-8')
          if 'RBVM_FORMULA_V1_PRESENTATION_UI_V1' in source:
              raise SystemExit('Formula UI contract already present')
          if source.count(anchor) != 1:
              raise SystemExit('shared bundle anchor drifted')
          patched = source.replace(anchor, '  <script>\n' + module + '  </script>\n' + anchor, 1)
          hosts = [
              'src/main/resources/web/index.html',
              'src/main/resources/web/cvss-v31.html',
              'src/main/resources/web/cisa-kev.html',
              'src/main/resources/web/epss.html',
              'src/main/resources/web/asset-context.html',
              'src/main/resources/web/network-reachability.html',
              'src/main/resources/web/business-impact.html',
              'src/main/resources/web/assets.html',
              'src/main/resources/web/asset-links.html',
          ]
          for host in hosts:
              Path(host).write_text(patched, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/resources/web
          git commit -m 'Add replay-verified Formula V1 browser presentation'
          git push origin HEAD:frontend/rbvm-formula-v1-presentation-v1

name: apply-v23

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/scanner-managed-asset-link-api-ui-v23'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/scanner-managed-asset-link-api-ui-v23
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install OpenAPI verifier dependency
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - name: Apply exact V23 changes
        run: |
          if grep -q 'ScannerManagedAssetLinkHttpRouter.inNamespace' src/main/java/io/rbvm/csv/CsvPlatformServer.java; then
            echo 'V23 source patch already present'
          else
            python3 .rbvm-v23/apply.py
          fi
      - name: Verify repository
        run: ./scripts/verify.sh
      - name: Verify reproducible distribution
        run: ./scripts/verify-reproducible-build.sh
      - name: Commit verified V23 source alignment
        run: |
          git config user.name 'rbvm-v23-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            README.md \
            api/openapi.yaml \
            build.gradle.kts \
            scripts/build-distribution.sh \
            scripts/verify-api.py \
            scripts/verify-reproducible-build.sh \
            scripts/verify.sh \
            src/main/java/io/rbvm/csv/ManagedAssetApi.java \
            src/main/java/io/rbvm/csv/CsvPlatformServer.java \
            src/main/resources/web/index.html \
            src/main/resources/web/assets.html \
            src/test/java/io/rbvm/csv/PlatformSelfTest.java
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No V23 source-alignment changes to commit'
            exit 0
          fi
          git commit -m 'Wire V23 scanner-managed asset link API and release [v23-applied]'
          git push origin HEAD:agent/scanner-managed-asset-link-api-ui-v23

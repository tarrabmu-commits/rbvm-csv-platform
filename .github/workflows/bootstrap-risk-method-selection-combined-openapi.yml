name: bootstrap-risk-method-selection-combined-openapi

on:
  push:
    branches:
      - policy/risk-method-selection-api-v1

permissions:
  contents: write

jobs:
  patch-openapi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: policy/risk-method-selection-api-v1
      - name: Patch combined OpenAPI
        run: python3 scripts/bootstrap-risk-method-selection-combined-openapi.py
      - name: Commit combined OpenAPI
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/openapi.yaml
          git diff --cached --check
          git commit -m 'Document risk method selection routes in combined OpenAPI'
          git push origin HEAD:policy/risk-method-selection-api-v1

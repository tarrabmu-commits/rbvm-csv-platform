name: csv-v2-live-benchmark

on:
  pull_request:
    paths:
      - 'scripts/enrich-uploaded-csv.py'
      - 'scripts/analyze-csv-run-evidence.py'
      - 'scripts/cvss_v4_official.py'
      - 'scripts/collect-public-vulnerability-intel.py'
      - 'scripts/run-csv-v2-live-benchmark.sh'
      - 'data/benchmarks/**'
      - '.github/workflows/csv-v2-live-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-uploaded-csv.py'
      - 'scripts/analyze-csv-run-evidence.py'
      - 'scripts/cvss_v4_official.py'
      - 'scripts/collect-public-vulnerability-intel.py'
      - 'scripts/run-csv-v2-live-benchmark.sh'
      - 'data/benchmarks/**'
      - '.github/workflows/csv-v2-live-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-public-intelligence-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run live CSV V2 benchmark
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash scripts/run-csv-v2-live-benchmark.sh
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csv-v2-live-benchmark
          path: build/csv-v2-live-benchmark
          if-no-files-found: error

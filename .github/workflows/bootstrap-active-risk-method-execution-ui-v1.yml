name: bootstrap-active-risk-method-execution-ui-v1

on:
  push:
    branches:
      - frontend/active-risk-method-execution-ui-v1

permissions:
  contents: write

jobs:
  patch-ui-hosts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: frontend/active-risk-method-execution-ui-v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Patch Frontend V2 hosts
        run: python3 scripts/bootstrap-active-risk-method-execution-ui-v1.py
      - name: Commit active execution UI hosts
        run: |
          set -euo pipefail
          paths=(
            src/main/resources/web/index.html
            src/main/resources/web/cvss-v31.html
            src/main/resources/web/cisa-kev.html
            src/main/resources/web/epss.html
            src/main/resources/web/asset-context.html
            src/main/resources/web/network-reachability.html
            src/main/resources/web/business-impact.html
            src/main/resources/web/assets.html
            src/main/resources/web/asset-links.html
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No active execution UI host changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Add active risk method execution UI V1'
          git push origin HEAD:frontend/active-risk-method-execution-ui-v1

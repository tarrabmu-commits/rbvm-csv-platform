name: finalize-v14-reachability-once

on:
  push:
    branches: [agent/network-reachability-postgres]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Finalize V14 wiring and remove one-shot tooling
        run: |
          python3 scripts/finalize-v14-reachability.py
          rm -f \
            scripts/align-v14-reachability.py \
            .github/workflows/align-v14-reachability.yml \
            scripts/finalize-v14-reachability.py \
            .github/workflows/finalize-v14-reachability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'V14 reachability branch already finalized'
          else
            git commit -m 'Finalize V14 reachability persistence wiring'
            git push origin HEAD:agent/network-reachability-postgres
          fi

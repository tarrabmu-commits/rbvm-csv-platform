name: trigger-v014-contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'foundation/cisa-kev-api-contract-v014' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Extract and run deterministic contract patch
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/apply-v014-contract.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply-v014.py
          python /tmp/apply-v014.py
          rm -f .github/workflows/apply-v014-contract.yml .github/workflows/trigger-v014-contract.yml
      - name: Commit generated alignment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Align CISA KEV API and release contract to 0.14.0"
          git push origin HEAD:${{ github.head_ref }}

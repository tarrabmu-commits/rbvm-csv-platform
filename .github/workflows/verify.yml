name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  dependency-free-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install OpenAPI verifier dependency
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - name: Verify 0.22.0 release contract
        run: ./scripts/verify-release-version.sh v0.22.0
      - name: Verify code, API, SQL, web, and scripts
        run: ./scripts/verify.sh
      - name: Verify reproducible distribution
        run: ./scripts/verify-reproducible-build.sh
      - name: Upload verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbvm-csv-platform-0.22.0
          path: |
            dist/rbvm-csv-platform-0.22.0.jar
            dist/rbvm-csv-platform-0.22.0.jar.sha256
            dist/rbvm-csv-platform-0.22.0.spdx.json
          if-no-files-found: error
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/rbvm-csv-platform-0.22.0.jar
      - name: Attest SPDX SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/rbvm-csv-platform-0.22.0.jar
          sbom-path: dist/rbvm-csv-platform-0.22.0.spdx.json

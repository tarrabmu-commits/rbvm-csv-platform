name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-free-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenAPI verifier dependency
        run: python -m pip install -r scripts/verification-requirements.txt
      - name: Verify code, API, SQL, web, and scripts
        run: ./scripts/verify.sh
      - name: Build distribution
        run: ./scripts/build-distribution.sh

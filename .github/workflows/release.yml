name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install verifier dependency
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - name: Verify release version
        run: ./scripts/verify-release-version.sh "$GITHUB_REF_NAME"
      - name: Verify source and reproducible artifact
        run: |
          ./scripts/verify.sh
          ./scripts/verify-reproducible-build.sh
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/rbvm-csv-platform-0.16.0.jar
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/rbvm-csv-platform-0.16.0.jar
          sbom-path: dist/rbvm-csv-platform-0.16.0.spdx.json
      - name: Publish immutable release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/rbvm-csv-platform-0.16.0.jar \
            dist/rbvm-csv-platform-0.16.0.jar.sha256 \
            dist/rbvm-csv-platform-0.16.0.spdx.json \
            --verify-tag --generate-notes --title "RBVM CSV Platform $GITHUB_REF_NAME"

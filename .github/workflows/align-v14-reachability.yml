name: align-v14-reachability-once

on:
  push:
    branches: [agent/network-reachability-postgres]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Apply deterministic V14 wiring and remove one-shot tooling
        run: |
          python3 scripts/align-v14-reachability.py
          rm scripts/align-v14-reachability.py .github/workflows/align-v14-reachability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire V14 reachability migration and verification'
          git push origin HEAD:agent/network-reachability-postgres

name: apply-frontend-system

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/pre-v24-frontend-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-v24-frontend-system
          fetch-depth: 0
      - name: Detect already-applied source commit
        id: state
        run: |
          if git log -1 --pretty=%B | grep -Fq '[frontend-system-applied]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.state.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.state.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Install verifier dependency
        if: steps.state.outputs.skip != 'true'
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - name: Apply frontend system
        if: steps.state.outputs.skip != 'true'
        run: python3 .frontend-system/apply.py
      - name: Verify repository
        if: steps.state.outputs.skip != 'true'
        run: ./scripts/verify.sh
      - name: Verify reproducible distribution
        if: steps.state.outputs.skip != 'true'
        run: ./scripts/verify-reproducible-build.sh
      - name: Smoke packaged frontend
        if: steps.state.outputs.skip != 'true'
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/rbvm-ui-smoke"
          mkdir -p "$data_dir"
          RBVM_DATA_DIR="$data_dir" RBVM_AUTH_MODE=DISABLED java -jar dist/rbvm-csv-platform-0.23.2.jar >"$RUNNER_TEMP/rbvm-ui.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/live >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ui/rbvm-ui.css | grep -F -- '--rbvm-control-min: 44px'
          curl --fail --silent http://127.0.0.1:8080/ui/rbvm-ui.js | grep -F 'RBVM_FRONTEND_SYSTEM_V1'
          for route in / /cvss /kev /epss /asset-context /reachability /business-impact /assets /asset-links; do
            curl --fail --silent "http://127.0.0.1:8080$route" | grep -F '/ui/rbvm-ui.css' >/dev/null
            curl --fail --silent "http://127.0.0.1:8080$route" | grep -F '/ui/rbvm-ui.js' >/dev/null
          done
      - name: Commit verified frontend source
        if: steps.state.outputs.skip != 'true'
        run: |
          git config user.name 'rbvm-frontend-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            README.md \
            api/openapi.yaml \
            build.gradle.kts \
            scripts/build-distribution.sh \
            scripts/verify-api.py \
            scripts/verify-frontend-system.py \
            scripts/verify-reproducible-build.sh \
            scripts/verify-scanner-managed-asset-link-api.py \
            scripts/verify.sh \
            src/main/java/io/rbvm/csv/CsvPlatformServer.java \
            src/main/resources/web/index.html \
            src/main/resources/web/cvss-v31.html \
            src/main/resources/web/cisa-kev.html \
            src/main/resources/web/epss.html \
            src/main/resources/web/asset-context.html \
            src/main/resources/web/network-reachability.html \
            src/main/resources/web/business-impact.html \
            src/main/resources/web/assets.html \
            src/main/resources/web/asset-links.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No frontend source changes to commit'
            exit 0
          fi
          git commit -m 'Apply RBVM frontend system and 0.23.2 alignment [frontend-system-applied]'
          git push origin HEAD:agent/pre-v24-frontend-system

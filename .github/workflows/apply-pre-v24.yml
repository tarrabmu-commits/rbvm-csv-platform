name: apply-pre-v24

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/pre-v24-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-v24-hardening
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install OpenAPI verifier dependency
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - name: Apply exact hardening patch
        run: python3 .pre-v24/apply.py
      - name: Verify repository
        run: ./scripts/verify.sh
      - name: Verify reproducible distribution
        run: ./scripts/verify-reproducible-build.sh
      - name: Commit verified hardening source
        run: |
          git config user.name 'rbvm-pre-v24-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            README.md \
            api/openapi.yaml \
            build.gradle.kts \
            docs/PRE_V24_HARDENING.md \
            scripts/build-distribution.sh \
            scripts/verify-api.py \
            scripts/verify-managed-assets-ui.py \
            scripts/verify-reproducible-build.sh \
            src/main/resources/web/assets.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No hardening changes to commit'
            exit 0
          fi
          git commit -m 'Apply pre-V24 hardening and 0.23.1 alignment [pre-v24-applied]'
          git push origin HEAD:agent/pre-v24-hardening

name: postgres-integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  v22-live-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: rbvm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-live-owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rbvm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned pgJDBC
        env:
          PGJDBC_VERSION: '42.7.13'
          PGJDBC_SHA256: '6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93'
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/postgresql-$PGJDBC_VERSION.jar"
          curl --fail --location --silent --show-error \
            "https://repo1.maven.org/maven2/org/postgresql/postgresql/$PGJDBC_VERSION/postgresql-$PGJDBC_VERSION.jar" \
            --output "$driver"
          printf '%s  %s\n' "$PGJDBC_SHA256" "$driver" | sha256sum --check
          printf 'RBVM_POSTGRES_DRIVER_JAR=%s\n' "$driver" >> "$GITHUB_ENV"
      - name: Compile application and tests
        run: ./scripts/compile.sh --tests
      - name: Run live V18-V31 persistence, Decision Input V3, Formula, derived-risk, policy, execution, intelligence, canonical-priority, and local-public-intelligence integration
        env:
          RBVM_PROJECTION_BACKEND: POSTGRESQL
          RBVM_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/rbvm?sslmode=disable
          RBVM_DB_USER: postgres
          RBVM_DB_PASSWORD: postgres-live-owner
          RBVM_DB_MIGRATE: 'true'
        run: |
          set -euo pipefail
          classpath="build/manual/main:build/manual/test:${RBVM_POSTGRES_DRIVER_JAR}"
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV23FormulaResultLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV24DerivedRiskLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV25RiskMethodSelectionPolicyLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV26RiskMethodSelectionActivationLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV27ActiveRiskMethodExecutionBindingLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresEvidenceAwareCatalogLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresDedicatedIntelligenceSummaryLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresCanonicalImportFindingManifestLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV29CanonicalMvpPriorityLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV30PublicIntelligenceStoreLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresPublicIntelligenceSyncBundleLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresV31PublicIntelligenceSyncJobLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresPublicIntelligenceSyncOrchestratorLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresPublicIntelligenceNvdBootstrapStateLiveSelfTest
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresCsvFirstLocalIntelligenceSnapshotExporterLiveSelfTest

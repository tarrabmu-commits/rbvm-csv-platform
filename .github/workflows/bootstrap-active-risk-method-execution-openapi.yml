name: bootstrap-active-risk-method-execution-openapi

on:
  push:
    branches:
      - api/active-risk-method-execution-v1

permissions:
  contents: write

jobs:
  patch-openapi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: api/active-risk-method-execution-v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Patch combined OpenAPI
        run: python3 scripts/bootstrap-active-risk-method-execution-openapi.py
      - name: Commit combined OpenAPI
        run: |
          set -euo pipefail
          if git diff --quiet -- api/openapi.yaml; then
            echo 'No combined OpenAPI changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/openapi.yaml
          git commit -m 'Compose active risk method execution OpenAPI V1'
          git push origin HEAD:api/active-risk-method-execution-v1

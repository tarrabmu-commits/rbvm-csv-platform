name: frontend-visual-smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    if: github.event.pull_request.head.ref == 'agent/pre-v24-frontend-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build distribution
        run: ./scripts/build-distribution.sh
      - name: Start RBVM server
        run: |
          data_dir="$RUNNER_TEMP/rbvm-visual"
          mkdir -p "$data_dir"
          RBVM_DATA_DIR="$data_dir" RBVM_AUTH_MODE=DISABLED nohup java -jar dist/rbvm-csv-platform-0.23.2.jar >"$RUNNER_TEMP/rbvm-visual.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/live >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/rbvm-visual.log"
          exit 1
      - name: Capture desktop and mobile screenshots
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo 'Chrome/Chromium is unavailable on the runner' >&2
            exit 1
          fi
          mkdir -p visual-smoke
          "$browser" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1100 --screenshot=visual-smoke/overview-desktop.png http://127.0.0.1:8080/
          "$browser" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1100 --screenshot=visual-smoke/assets-desktop.png http://127.0.0.1:8080/assets
          "$browser" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1100 --screenshot=visual-smoke/links-desktop.png http://127.0.0.1:8080/asset-links
          "$browser" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/overview-mobile.png http://127.0.0.1:8080/
          "$browser" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=visual-smoke/assets-mobile.png http://127.0.0.1:8080/assets
          for file in visual-smoke/*.png; do test -s "$file"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbvm-frontend-visual-smoke
          path: visual-smoke/*.png
          if-no-files-found: error

name: apply-frontend-nav-fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/pre-v24-frontend-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-v24-frontend-system
          fetch-depth: 0
      - name: Detect navigation refinement
        id: state
        run: |
          if grep -Fq "function createMobileNav()" src/main/resources/web/rbvm-ui.js; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply exact navigation refinement
        if: steps.state.outputs.skip != 'true'
        run: python3 .frontend-nav-fix.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: steps.state.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.state.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Install verifier dependency
        if: steps.state.outputs.skip != 'true'
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - name: Verify repository
        if: steps.state.outputs.skip != 'true'
        run: ./scripts/verify.sh
      - name: Commit verified refinement
        if: steps.state.outputs.skip != 'true'
        run: |
          git config user.name 'rbvm-frontend-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- src/main/resources/web/rbvm-ui.css src/main/resources/web/rbvm-ui.js
          git diff --cached --check
          git commit -m 'Refine responsive RBVM navigation [frontend-nav-applied]'
          git push origin HEAD:agent/pre-v24-frontend-system

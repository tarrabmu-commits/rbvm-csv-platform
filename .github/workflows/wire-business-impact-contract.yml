name: wire-business-impact-contract-once

on:
  push:
    branches: [agent/business-mission-impact-contract]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Wire self-test and remove one-shot tooling
        run: |
          python3 scripts/wire-business-impact-contract.py
          rm -f scripts/wire-business-impact-contract.py .github/workflows/wire-business-impact-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire Business Impact contract self-test'
          git push origin HEAD:agent/business-mission-impact-contract

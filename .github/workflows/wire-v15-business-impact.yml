name: wire-v15-business-impact-once

on:
  push:
    branches: [agent/business-impact-postgres]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Wire V15 persistence and remove one-shot tooling
        run: |
          python3 scripts/wire-v15-business-impact.py
          rm -f scripts/wire-v15-business-impact.py .github/workflows/wire-v15-business-impact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire V15 Business Impact persistence and verification'
          git push origin HEAD:agent/business-impact-postgres

name: bootstrap-resolved-active-risk-method-api-v1

on:
  push:
    branches:
      - policy/resolved-active-risk-method-api-v1

permissions:
  contents: write

jobs:
  patch-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: policy/resolved-active-risk-method-api-v1
      - name: Patch resolved active risk method API
        run: python3 scripts/bootstrap-resolved-active-risk-method-api-v1.py
      - name: Commit API update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/rbvm/csv/RiskMethodSelectionPolicyApi.java src/main/java/io/rbvm/csv/RiskMethodSelectionPolicyHttpRouter.java
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Resolve active risk method identity'
          git push origin HEAD:policy/resolved-active-risk-method-api-v1

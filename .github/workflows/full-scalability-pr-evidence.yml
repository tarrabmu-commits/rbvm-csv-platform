name: full-scalability-pr-evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  progressive-evidence:
    if: github.head_ref == 'full-scalability-benchmark-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: rbvm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-scalability-owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rbvm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fetch pinned pgJDBC
        env:
          PGJDBC_VERSION: '42.7.13'
          PGJDBC_SHA256: '6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93'
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/postgresql-$PGJDBC_VERSION.jar"
          curl --fail --location --silent --show-error \
            "https://repo1.maven.org/maven2/org/postgresql/postgresql/$PGJDBC_VERSION/postgresql-$PGJDBC_VERSION.jar" \
            --output "$driver"
          printf '%s  %s\n' "$PGJDBC_SHA256" "$driver" | sha256sum --check
          printf 'RBVM_POSTGRES_DRIVER_JAR=%s\n' "$driver" >> "$GITHUB_ENV"
      - name: Apply reverse index and lateral manifest lookup experiment
        run: |
          set -euo pipefail
          cat > db/migration/V32__exposure_observation_reverse_lookup.sql <<'SQL'
          BEGIN;
          CREATE INDEX exposure_observation_observation_lookup_idx
              ON rbvm.exposure_observation (tenant_id, observation_id, exposure_id);
          COMMIT;
          SQL
          python3 - <<'PY'
          from pathlib import Path

          migrator = Path('src/main/java/io/rbvm/postgres/PostgresMigrator.java')
          source = migrator.read_text()
          old = '            new Migration(31, "V31__public_intelligence_sync_job.sql")\n    );'
          new = ('            new Migration(31, "V31__public_intelligence_sync_job.sql"),\n'
                 '            new Migration(32, "V32__exposure_observation_reverse_lookup.sql")\n'
                 '    );')
          assert source.count(old) == 1, 'migration tail marker drifted'
          migrator.write_text(source.replace(old, new, 1))

          exporter = Path('src/main/java/io/rbvm/postgres/PostgresCanonicalImportFindingExporter.java')
          source = exporter.read_text()
          start_marker = '            try (PreparedStatement statement = connection.prepareStatement("""\n                    SELECT e.id AS finding_id,'
          start = source.index(start_marker)
          sql_end = source.index('                    """)) {', start) + len('                    """)) {')
          replacement = '''            try (PreparedStatement statement = connection.prepareStatement("""
                    SELECT e.id AS finding_id,
                           MIN(io.source_row_number) AS source_row_number,
                           sp.external_key AS source_profile_key,
                           a.observed_name AS asset_name,
                           v.cve_id,
                           ac.observed_product_name AS product_name,
                           e.status AS finding_status,
                           e.current_severity
                    FROM rbvm.import_observation io
                    JOIN rbvm.import_run ir
                      ON ir.tenant_id = io.tenant_id AND ir.id = io.import_id
                    JOIN rbvm.source_profile sp
                      ON sp.tenant_id = ir.tenant_id AND sp.id = ir.source_profile_id
                    JOIN rbvm.tenant t
                      ON t.id = ir.tenant_id
                    JOIN LATERAL (
                        SELECT link.exposure_id
                        FROM rbvm.exposure_observation link
                        WHERE link.tenant_id = io.tenant_id
                          AND link.observation_id = io.observation_id
                        OFFSET 0
                    ) eo ON true
                    JOIN rbvm.exposure e
                      ON e.tenant_id = io.tenant_id AND e.id = eo.exposure_id
                    JOIN rbvm.asset a
                      ON a.tenant_id = e.tenant_id AND a.id = e.asset_id
                    JOIN rbvm.vulnerability v
                      ON v.id = e.vulnerability_id
                    JOIN rbvm.asset_component ac
                      ON ac.tenant_id = e.tenant_id AND ac.id = e.component_id
                    WHERE io.import_id = ? AND t.tenant_key = ?
                    GROUP BY e.id, sp.external_key, a.observed_name, v.cve_id,
                             ac.observed_product_name, e.status, e.current_severity
                    ORDER BY MIN(io.source_row_number), e.id
                    """)) {'''
          source = source[:start] + replacement + source[sql_end:]
          exporter.write_text(source)
          PY
          git diff --check -- \
            src/main/java/io/rbvm/postgres/PostgresMigrator.java \
            src/main/java/io/rbvm/postgres/PostgresCanonicalImportFindingExporter.java \
            db/migration/V32__exposure_observation_reverse_lookup.sql
      - name: Compile benchmark runtime
        run: ./scripts/compile.sh --tests
      - name: Run 10K lateral-manifest A/B
        env:
          RBVM_PROJECTION_BACKEND: POSTGRESQL
          RBVM_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/rbvm?sslmode=disable
          RBVM_DB_USER: postgres
          RBVM_DB_PASSWORD: postgres-scalability-owner
          RBVM_DB_MIGRATE: 'true'
          RBVM_SCALABILITY_BENCHMARK_MODE: 'true'
        run: |
          set -euo pipefail
          python3 scripts/run-full-scalability-benchmark-isolated.py \
            --sizes 10000 \
            --stress-max-rows 10000 \
            --tier-timeout-seconds 900 \
            --output-directory build/full-scalability-pr-evidence
          classpath="build/manual/main:build/manual/test:${RBVM_POSTGRES_DRIVER_JAR}"
          java -ea -cp "$classpath" io.rbvm.postgres.PostgresFullScalabilityTableStatsProbe \
            build/full-scalability-pr-evidence/postgres-table-stats.tsv
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbvm-full-scalability-pr-evidence-${{ github.sha }}
          path: build/full-scalability-pr-evidence/
          if-no-files-found: warn
          retention-days: 30

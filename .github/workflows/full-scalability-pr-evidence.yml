name: full-scalability-pr-evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  promote-parent-mutation-coalescing:
    if: github.head_ref == 'full-scalability-benchmark-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: full-scalability-benchmark-v1
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply measured parent-mutation coalescing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java')
          source = path.read_text()
          original = source

          assert source.count('                verifyAnalysis(input.analysis(), projected, accumulator);') == 1
          source = source.replace(
              '                verifyAnalysis(input.analysis(), projected, accumulator);\n'
              '                recomputeCases(connection, tenantId, sourceProfileId, now);',
              '                verifyAnalysis(input.analysis(), projected, accumulator);\n'
              '                accumulator.parentMutations.flush(connection);\n'
              '                recomputeCases(connection, tenantId, sourceProfileId, now);',
              1,
          )

          astart = source.index('    private static EntityRef ensureAsset(')
          aend = source.index('    private static EntityRef ensureVulnerability(', astart)
          asset = source[astart:aend]
          asset = asset.replace(
              '        EntityRef cached = accumulator.assets.get(naturalKey);\n'
              '        if (cached == null) {',
              '        EntityRef cached = accumulator.assets.get(naturalKey);\n'
              '        boolean createdThisCall = false;\n'
              '        if (cached == null) {',
              1,
          )
          asset = asset.replace(
              '            if (isNew) {\n'
              '                accumulator.newAssets++;\n'
              '            }',
              '            if (isNew) {\n'
              '                accumulator.newAssets++;\n'
              '                createdThisCall = true;\n'
              '            }',
              1,
          )
          update_start = asset.index('        executeUpdate(connection, """\n                UPDATE rbvm.asset SET')
          update_end = asset.index('        return cached;', update_start)
          asset = (asset[:update_start]
                   + '        accumulator.parentMutations.observeAsset(\n'
                     '                cached.id(), cached.publicId(), createdThisCall, observation);\n'
                   + asset[update_end:])
          source = source[:astart] + asset + source[aend:]

          vstart = source.index('    private static EntityRef ensureVulnerability(')
          vend = source.index('    private static EntityRef ensureComponent(', vstart)
          vulnerability = source[vstart:vend]
          vulnerability = vulnerability.replace(
              '        EntityRef cached = accumulator.vulnerabilities.get(observation.cveId());\n'
              '        if (cached == null) {',
              '        EntityRef cached = accumulator.vulnerabilities.get(observation.cveId());\n'
              '        boolean createdThisCall = false;\n'
              '        if (cached == null) {',
              1,
          )
          vulnerability = vulnerability.replace(
              '            if (isNew) {\n'
              '                accumulator.newVulnerabilities++;\n'
              '            }',
              '            if (isNew) {\n'
              '                accumulator.newVulnerabilities++;\n'
              '                createdThisCall = true;\n'
              '            }',
              1,
          )
          update_start = vulnerability.index('        executeUpdate(connection, """\n                UPDATE rbvm.vulnerability SET')
          update_end = vulnerability.index('        return cached;', update_start)
          vulnerability = (vulnerability[:update_start]
                           + '        accumulator.parentMutations.observeVulnerability(\n'
                             '                cached.id(), createdThisCall, observation);\n'
                           + vulnerability[update_end:])
          source = source[:vstart] + vulnerability + source[vend:]

          cstart = source.index('    private static EntityRef ensureComponent(')
          cend = source.index('    private static UUID insertObservation(', cstart)
          component = source[cstart:cend]
          component = component.replace(
              '        EntityRef cached = accumulator.components.get(naturalKey);\n'
              '        if (cached == null) {',
              '        EntityRef cached = accumulator.components.get(naturalKey);\n'
              '        boolean createdThisCall = false;\n'
              '        if (cached == null) {',
              1,
          )
          component = component.replace(
              '            if (isNew) {\n'
              '                accumulator.newComponents++;\n'
              '            }',
              '            if (isNew) {\n'
              '                accumulator.newComponents++;\n'
              '                createdThisCall = true;\n'
              '            }',
              1,
          )
          update_start = component.index('        executeUpdate(connection, """\n                UPDATE rbvm.asset_component SET')
          update_end = component.index('        return cached;', update_start)
          update_block = component[update_start:update_end]
          indented = ''.join('    ' + line if line.strip() else line for line in update_block.splitlines(True))
          component = (component[:update_start]
                       + '        if (!createdThisCall) {\n'
                       + indented
                       + '        }\n'
                       + component[update_end:])
          source = source[:cstart] + component + source[cend:]

          source = source.replace(
              '        private final Instant now;\n'
              '        private final Map<String, EntityRef> assets = new HashMap<>();',
              '        private final Instant now;\n'
              '        private final PostgresCanonicalProjectionMutationBuffer parentMutations;\n'
              '        private final Map<String, EntityRef> assets = new HashMap<>();',
              1,
          )
          source = source.replace(
              '            this.input = input;\n'
              '            this.now = now;\n',
              '            this.input = input;\n'
              '            this.now = now;\n'
              '            this.parentMutations = new PostgresCanonicalProjectionMutationBuffer(tenantId, now);\n',
              1,
          )

          if source == original:
              raise SystemExit('Parent-mutation transform produced no source diff')
          path.write_text(source)
          PY
          git diff --check -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
          grep -n "parentMutations\|createdThisCall" src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
      - name: Compile promoted source
        run: ./scripts/compile.sh --tests
      - name: Commit promoted source
        env:
          TARGET_BRANCH: full-scalability-benchmark-v1
        run: |
          set -euo pipefail
          test -n "$(git status --short -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
          git commit -m 'Coalesce canonical parent mutations'
          git push origin "HEAD:${TARGET_BRANCH}"

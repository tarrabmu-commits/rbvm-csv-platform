name: full-scalability-pr-evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  promote-projection-optimization:
    if: github.head_ref == 'full-scalability-benchmark-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: full-scalability-benchmark-v1
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply measured projection optimization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java')
          source = path.read_text()
          original = source

          # 1. INSERT ... ON CONFLICT already tells us whether an observation exists.
          marker = '        UUID existingObservation = selectUuid(connection, """'
          if marker in source:
              start = source.index(marker)
              end = source.index('        EntityRef asset = ensureAsset(', start)
              source = source[:start] + source[end:]

          # 2. A newly inserted exposure already contains public_id; avoid the immediate UPDATE.
          old = ('        if (!createdThisCall) {\n'
                 '            updateExistingExposure(connection, accumulator, cached, observation);\n'
                 '        } else {\n'
                 '            executeUpdate(connection, """\n'
                 '                    UPDATE rbvm.exposure SET public_id = ?\n'
                 '                    WHERE tenant_id = ? AND id = ?\n'
                 '                    """, cached.publicId(), accumulator.tenantId, cached.id());\n'
                 '        }\n'
                 '        return cached;')
          new = ('        if (!createdThisCall) {\n'
                 '            updateExistingExposure(connection, accumulator, cached, observation);\n'
                 '        }\n'
                 '        return cached;')
          if old in source:
              source = source.replace(old, new, 1)

          # 3. New cases already contain public_id. Only a DB-existing case needs the legacy
          #    backfill/update once when it first enters this import cache.
          case_start = source.index('    private static EntityRef ensureCase(')
          case_end = source.index('    private static EntityRef ensureExposure(', case_start)
          case = source[case_start:case_end]
          old = ('            } else {\n'
                 '                accumulator.updatedCaseIds.add(cached.id());\n'
                 '            }\n'
                 '        }\n'
                 '        executeUpdate(connection, """\n'
                 '                UPDATE rbvm.vulnerability_case SET public_id = ?, updated_at = ?\n'
                 '                WHERE tenant_id = ? AND id = ?\n'
                 '                """, cached.publicId(), accumulator.now, accumulator.tenantId, cached.id());\n'
                 '        return cached;')
          new = ('            } else {\n'
                 '                accumulator.updatedCaseIds.add(cached.id());\n'
                 '                executeUpdate(connection, """\n'
                 '                        UPDATE rbvm.vulnerability_case SET public_id = ?, updated_at = ?\n'
                 '                        WHERE tenant_id = ? AND id = ?\n'
                 '                        """, cached.publicId(), accumulator.now,\n'
                 '                        accumulator.tenantId, cached.id());\n'
                 '            }\n'
                 '        }\n'
                 '        return cached;')
          if old in case:
              case = case.replace(old, new, 1)
              source = source[:case_start] + case + source[case_end:]

          if source == original:
              raise SystemExit('Measured optimization produced no source diff')
          path.write_text(source)
          PY
          git diff --check -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
          git diff -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
      - name: Compile optimized source
        run: ./scripts/compile.sh --tests
      - name: Commit optimized source
        env:
          TARGET_BRANCH: full-scalability-benchmark-v1
        run: |
          set -euo pipefail
          test -n "$(git status --short -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
          git commit -m 'Reduce canonical projection round trips'
          git push origin "HEAD:${TARGET_BRANCH}"

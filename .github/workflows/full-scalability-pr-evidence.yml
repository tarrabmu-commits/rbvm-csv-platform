name: full-scalability-pr-evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  progressive-evidence:
    if: github.head_ref == 'full-scalability-benchmark-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: rbvm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-scalability-owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rbvm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - id: promote
        name: Promote resource-exhaustion classification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run-full-scalability-benchmark.py')
          source = runner.read_text()
          old = '''        metrics = {
              "status": "PASS" if completed.returncode == 0 else "FAILED",
              "returnCode": completed.returncode,
              "wallSeconds": round(wall, 3),
              **parse_time_v(time_file),
          }
          if completed.returncode != 0:
              metrics["stderrTail"] = tail(stderr_file)
          return metrics
          '''
          # Keep indentation exact to the source, while avoiding duplicated promotion.
          old = old.replace('          ', '        ')
          new = '''        stderr_tail = tail(stderr_file) if completed.returncode != 0 else ""
          status = "PASS"
          if completed.returncode != 0:
              resource_failure = completed.returncode in {137, -9}
              marker = "SQLState="
              if marker in stderr_tail:
                  sqlstate = stderr_tail.split(marker, 1)[1][:5]
                  resource_failure = resource_failure or sqlstate.startswith("53")
              status = "RESOURCE_EXHAUSTION" if resource_failure else "FAILED"
          metrics = {
              "status": status,
              "returnCode": completed.returncode,
              "wallSeconds": round(wall, 3),
              **parse_time_v(time_file),
          }
          if stderr_tail:
              metrics["stderrTail"] = stderr_tail
          return metrics
          '''.replace('          ', '        ')
          if 'status = "RESOURCE_EXHAUSTION" if resource_failure else "FAILED"' not in source:
              assert source.count(old) == 1, 'run_stage failure-classification marker drifted'
              runner.write_text(source.replace(old, new, 1))

          verifier = Path('scripts/verify-full-scalability-benchmark.py')
          source = verifier.read_text()
          anchor = '    \'"MEASURED_BOTTLENECK_OR_FAILURE"\',\n'
          addition = '    \'"RESOURCE_EXHAUSTION"\',\n'
          if addition not in source:
              assert source.count(anchor) == 1, 'benchmark verifier capacity marker drifted'
              verifier.write_text(source.replace(anchor, anchor + addition, 1))
          PY
          git diff --check -- \
            scripts/run-full-scalability-benchmark.py \
            scripts/verify-full-scalability-benchmark.py
          python3 scripts/verify-full-scalability-benchmark.py
          if git diff --quiet -- \
              scripts/run-full-scalability-benchmark.py \
              scripts/verify-full-scalability-benchmark.py; then
            echo 'promoted=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/run-full-scalability-benchmark.py scripts/verify-full-scalability-benchmark.py
            git commit -m 'Classify benchmark resource exhaustion'
            git push origin HEAD:${{ github.head_ref }}
            echo 'promoted=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch pinned pgJDBC
        if: steps.promote.outputs.promoted == 'false'
        env:
          PGJDBC_VERSION: '42.7.13'
          PGJDBC_SHA256: '6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93'
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/postgresql-$PGJDBC_VERSION.jar"
          curl --fail --location --silent --show-error \
            "https://repo1.maven.org/maven2/org/postgresql/postgresql/$PGJDBC_VERSION/postgresql-$PGJDBC_VERSION.jar" \
            --output "$driver"
          printf '%s  %s\n' "$PGJDBC_SHA256" "$driver" | sha256sum --check
          printf 'RBVM_POSTGRES_DRIVER_JAR=%s\n' "$driver" >> "$GITHUB_ENV"
      - name: Compile benchmark runtime
        if: steps.promote.outputs.promoted == 'false'
        run: ./scripts/compile.sh --tests
      - name: Run production 200K resource-bottleneck evidence
        if: steps.promote.outputs.promoted == 'false'
        env:
          RBVM_PROJECTION_BACKEND: POSTGRESQL
          RBVM_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/rbvm?sslmode=disable
          RBVM_DB_USER: postgres
          RBVM_DB_PASSWORD: postgres-scalability-owner
          RBVM_DB_MIGRATE: 'true'
          RBVM_SCALABILITY_BENCHMARK_MODE: 'true'
        run: |
          set -euo pipefail
          python3 scripts/run-full-scalability-benchmark-isolated.py \
            --sizes 200000 \
            --stress \
            --stress-max-rows 200000 \
            --tier-timeout-seconds 900 \
            --output-directory build/full-scalability-pr-evidence
      - name: Upload benchmark evidence
        if: always() && steps.promote.outputs.promoted == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbvm-full-scalability-pr-evidence-${{ github.sha }}
          path: build/full-scalability-pr-evidence/
          if-no-files-found: warn
          retention-days: 30

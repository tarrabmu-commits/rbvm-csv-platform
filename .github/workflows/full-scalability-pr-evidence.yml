name: full-scalability-pr-evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  progressive-evidence:
    if: github.head_ref == 'full-scalability-benchmark-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Promote reverse lookup and parameterized manifest
        run: |
          set -euo pipefail
          cat > db/migration/V32__exposure_observation_reverse_lookup.sql <<'SQL'
          BEGIN;

          -- Exact import -> observation -> Finding lineage reads start from observation_id.
          -- The original PK is exposure-first, so add the reverse lookup shape explicitly.
          CREATE INDEX exposure_observation_observation_lookup_idx
              ON rbvm.exposure_observation (tenant_id, observation_id, exposure_id);

          COMMIT;
          SQL
          python3 - <<'PY'
          from pathlib import Path

          migrator = Path('src/main/java/io/rbvm/postgres/PostgresMigrator.java')
          source = migrator.read_text()
          old = '            new Migration(31, "V31__public_intelligence_sync_job.sql")\n    );'
          new = ('            new Migration(31, "V31__public_intelligence_sync_job.sql"),\n'
                 '            new Migration(32, "V32__exposure_observation_reverse_lookup.sql")\n'
                 '    );')
          if 'V32__exposure_observation_reverse_lookup.sql' not in source:
              assert source.count(old) == 1, 'migration tail marker drifted'
              migrator.write_text(source.replace(old, new, 1))

          exporter = Path('src/main/java/io/rbvm/postgres/PostgresCanonicalImportFindingExporter.java')
          source = exporter.read_text()
          if 'JOIN LATERAL (\n                        SELECT link.exposure_id' not in source:
              start_marker = '            try (PreparedStatement statement = connection.prepareStatement("""\n                    SELECT e.id AS finding_id,'
              start = source.index(start_marker)
              sql_end = source.index('                    """)) {', start) + len('                    """)) {')
              replacement = '''            try (PreparedStatement statement = connection.prepareStatement("""
                    SELECT e.id AS finding_id,
                           MIN(io.source_row_number) AS source_row_number,
                           sp.external_key AS source_profile_key,
                           a.observed_name AS asset_name,
                           v.cve_id,
                           ac.observed_product_name AS product_name,
                           e.status AS finding_status,
                           e.current_severity
                    FROM rbvm.import_observation io
                    JOIN rbvm.import_run ir
                      ON ir.tenant_id = io.tenant_id AND ir.id = io.import_id
                    JOIN rbvm.source_profile sp
                      ON sp.tenant_id = ir.tenant_id AND sp.id = ir.source_profile_id
                    JOIN rbvm.tenant t
                      ON t.id = ir.tenant_id
                    JOIN LATERAL (
                        SELECT link.exposure_id
                        FROM rbvm.exposure_observation link
                        WHERE link.tenant_id = io.tenant_id
                          AND link.observation_id = io.observation_id
                        OFFSET 0
                    ) eo ON true
                    JOIN LATERAL (
                        SELECT x.id, x.asset_id, x.vulnerability_id, x.component_id,
                               x.status, x.current_severity
                        FROM rbvm.exposure x
                        WHERE x.tenant_id = io.tenant_id
                          AND x.id = eo.exposure_id
                        OFFSET 0
                    ) e ON true
                    JOIN LATERAL (
                        SELECT x.observed_name
                        FROM rbvm.asset x
                        WHERE x.tenant_id = io.tenant_id AND x.id = e.asset_id
                        OFFSET 0
                    ) a ON true
                    JOIN LATERAL (
                        SELECT x.cve_id
                        FROM rbvm.vulnerability x
                        WHERE x.id = e.vulnerability_id
                        OFFSET 0
                    ) v ON true
                    JOIN LATERAL (
                        SELECT x.observed_product_name
                        FROM rbvm.asset_component x
                        WHERE x.tenant_id = io.tenant_id AND x.id = e.component_id
                        OFFSET 0
                    ) ac ON true
                    WHERE io.import_id = ? AND t.tenant_key = ?
                    GROUP BY e.id, sp.external_key, a.observed_name, v.cve_id,
                             ac.observed_product_name, e.status, e.current_severity
                    ORDER BY MIN(io.source_row_number), e.id
                    """)) {'''
              exporter.write_text(source[:start] + replacement + source[sql_end:])

          selftest = Path('src/test/java/io/rbvm/postgres/PostgresMigratorSelfTest.java')
          source = selftest.read_text()
          source = source.replace('private static final int LATEST_SCHEMA_VERSION = 31;',
                                  'private static final int LATEST_SCHEMA_VERSION = 32;')
          anchor = '''        assert database.executedSql.stream().anyMatch(sql ->\n                sql.contains("CREATE VIEW rbvm.public_intelligence_provider_status_v1"));\n'''
          check = '''        assert database.executedSql.stream().anyMatch(sql ->\n                sql.contains("CREATE INDEX exposure_observation_observation_lookup_idx"));\n'''
          if check not in source:
              assert source.count(anchor) == 1, 'migration self-test anchor drifted'
              source = source.replace(anchor, anchor + check, 1)
          selftest.write_text(source)
          PY
          git diff --check -- \
            db/migration/V32__exposure_observation_reverse_lookup.sql \
            src/main/java/io/rbvm/postgres/PostgresMigrator.java \
            src/main/java/io/rbvm/postgres/PostgresCanonicalImportFindingExporter.java \
            src/test/java/io/rbvm/postgres/PostgresMigratorSelfTest.java
          ./scripts/compile.sh --tests
      - name: Commit promoted source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            db/migration/V32__exposure_observation_reverse_lookup.sql \
            src/main/java/io/rbvm/postgres/PostgresMigrator.java \
            src/main/java/io/rbvm/postgres/PostgresCanonicalImportFindingExporter.java \
            src/test/java/io/rbvm/postgres/PostgresMigratorSelfTest.java
          if git diff --cached --quiet; then
            echo 'Parameterized manifest already promoted.'
            exit 0
          fi
          git commit -m 'Optimize exact Finding manifest lookups'
          git push origin HEAD:${{ github.head_ref }}

name: full-scalability-pr-evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  promote-projection-optimization:
    if: github.head_ref == 'full-scalability-benchmark-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: full-scalability-benchmark-v1
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply measured projection optimization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java')
          source = path.read_text()
          original = source

          preselect = '''        UUID existingObservation = selectUuid(connection, """
                  SELECT id FROM rbvm.observation
                  WHERE tenant_id = ? AND source_profile_id = ? AND fingerprint = ?
                  """, accumulator.tenantId, accumulator.sourceProfileId,
                  observation.observationFingerprint());
          if (existingObservation != null) {
              accumulator.duplicateObservations++;
              linkImportObservation(connection, accumulator, observation, existingObservation);
              return;
          }

          '''
          preselect = preselect.replace('          ', '        ')
          if preselect in source:
              source = source.replace(preselect, '', 1)

          exposure_old = '''        if (!createdThisCall) {
              updateExistingExposure(connection, accumulator, cached, observation);
          } else {
              executeUpdate(connection, """
                      UPDATE rbvm.exposure SET public_id = ?
                      WHERE tenant_id = ? AND id = ?
                      """, cached.publicId(), accumulator.tenantId, cached.id());
          }
          return cached;
          }'''.replace('          ', '        ')
          exposure_new = '''        if (!createdThisCall) {
              updateExistingExposure(connection, accumulator, cached, observation);
          }
          return cached;
          }'''.replace('          ', '        ')
          if exposure_old in source:
              source = source.replace(exposure_old, exposure_new, 1)

          case_marker = '''        EntityRef cached = accumulator.cases.get(naturalKey);
          if (cached == null) {'''.replace('          ', '        ')
          if case_marker in source and 'boolean existingCase = false;' not in source[source.index('    private static EntityRef ensureCase('):source.index('    private static EntityRef ensureExposure(')]:
              source = source.replace(
                  case_marker,
                  '''        EntityRef cached = accumulator.cases.get(naturalKey);
          boolean existingCase = false;
          if (cached == null) {'''.replace('          ', '        '),
                  1,
              )

          case_old = '''            } else {
                  accumulator.updatedCaseIds.add(cached.id());
              }
          }
          executeUpdate(connection, """
                  UPDATE rbvm.vulnerability_case SET public_id = ?, updated_at = ?
                  WHERE tenant_id = ? AND id = ?
                  """, cached.publicId(), accumulator.now, accumulator.tenantId, cached.id());
          return cached;
          }'''.replace('          ', '        ')
          case_new = '''            } else {
                  accumulator.updatedCaseIds.add(cached.id());
                  existingCase = true;
              }
          }
          if (existingCase) {
              executeUpdate(connection, """
                      UPDATE rbvm.vulnerability_case SET public_id = ?, updated_at = ?
                      WHERE tenant_id = ? AND id = ?
                      """, cached.publicId(), accumulator.now, accumulator.tenantId, cached.id());
          }
          return cached;
          }'''.replace('          ', '        ')
          if case_old in source:
              source = source.replace(case_old, case_new, 1)

          if source != original:
              path.write_text(source)
          PY
      - name: Compile optimized source
        run: ./scripts/compile.sh --tests
      - name: Commit optimized source
        env:
          TARGET_BRANCH: full-scalability-benchmark-v1
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java; then
            echo 'Measured optimization already promoted; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
          git commit -m 'Reduce canonical projection round trips'
          git push origin "HEAD:${TARGET_BRANCH}"

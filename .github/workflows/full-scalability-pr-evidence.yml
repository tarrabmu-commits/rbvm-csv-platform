name: full-scalability-pr-evidence

on:
  pull_request:

permissions:
  contents: write

jobs:
  progressive-evidence:
    if: github.head_ref == 'full-scalability-benchmark-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Promote custom plans to import projection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java')
          source = path.read_text()
          marker = '''            beginProjectionTransaction(connection);\n            try {\n                Instant now = clock.instant();\n'''
          replacement = '''            beginProjectionTransaction(connection);\n            try {\n                try (PreparedStatement planMode = connection.prepareStatement(\n                        "SET LOCAL plan_cache_mode = force_custom_plan")) {\n                    planMode.execute();\n                }\n                Instant now = clock.instant();\n'''
          if 'SET LOCAL plan_cache_mode = force_custom_plan' not in source:
              assert source.count(marker) >= 1, 'import projection marker drifted'
              source = source.replace(marker, replacement, 1)
              path.write_text(source)
          PY
          git diff --check -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
          ./scripts/compile.sh --tests
      - name: Commit promoted source
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java; then
            echo 'Import projection custom plans already promoted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/io/rbvm/postgres/PostgresCanonicalProjection.java
          git commit -m 'Use custom plans for canonical import projection'
          git push origin HEAD:${{ github.head_ref }}

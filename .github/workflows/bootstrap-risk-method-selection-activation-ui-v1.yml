name: bootstrap-risk-method-selection-activation-ui-v1

on:
  push:
    branches:
      - frontend/risk-method-selection-activation-ui-v1

permissions:
  contents: write

jobs:
  patch-hosts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: frontend/risk-method-selection-activation-ui-v1
      - name: Patch shared Frontend V2 hosts
        run: python3 scripts/bootstrap-risk-method-selection-activation-ui-v1.py
      - name: Commit shared host update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/web/*.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Add exact risk method activation UI'
          git push origin HEAD:frontend/risk-method-selection-activation-ui-v1

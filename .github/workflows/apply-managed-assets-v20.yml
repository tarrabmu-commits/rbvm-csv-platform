name: apply-managed-assets-v20

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/managed-assets-ui-v20'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: agent/managed-assets-ui-v20
      - id: bootstrap
        name: Check whether publication payload remains
        shell: bash
        run: |
          if [[ -f .rbvm-bootstrap/v20/part-00 ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.bootstrap.outputs.needed == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - if: steps.bootstrap.outputs.needed == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: steps.bootstrap.outputs.needed == 'true'
        name: Install verifier dependency
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - if: steps.bootstrap.outputs.needed == 'true'
        name: Apply reviewed Increment 20 changeset
        shell: bash
        run: |
          set -euo pipefail
          cat .rbvm-bootstrap/v20/part-* | base64 -d > /tmp/rbvm-v20-payload.zip
          rm -rf /tmp/rbvm-v20-payload
          mkdir -p /tmp/rbvm-v20-payload
          unzip -q /tmp/rbvm-v20-payload.zip -d /tmp/rbvm-v20-payload
          python3 /tmp/rbvm-v20-payload/rbvm-v20-ui-bundle/apply_v20.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-api.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if document.get("info", {}).get("version") != "0.19.0":
                  raise AssertionError("OpenAPI info.version must match Increment 19")'''
          new = '''    if document.get("info", {}).get("version") != "0.20.0":
                  raise AssertionError("OpenAPI info.version must match Increment 20")'''
          if text.count(old) != 1:
              raise SystemExit('verify-api V19 version assertion context mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - if: steps.bootstrap.outputs.needed == 'true'
        name: Verify release contract and repository
        run: |
          ./scripts/verify-release-version.sh v0.20.0
          ./scripts/verify.sh
          ./scripts/verify-reproducible-build.sh
      - if: steps.bootstrap.outputs.needed == 'true'
        name: Commit verified Increment 20 source
        shell: bash
        run: |
          set -euo pipefail
          git restore -- .github/workflows/verify.yml .github/workflows/release.yml
          git rm -r -- .rbvm-bootstrap
          git config user.name 'rbvm-ci-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            README.md \
            api/openapi.yaml \
            build.gradle.kts \
            docs/INCREMENT_20_VALIDATION.md \
            docs/MANAGED_ASSETS_UI_V1.md \
            scripts/build-distribution.sh \
            scripts/verify-api.py \
            scripts/verify-managed-assets-ui.py \
            scripts/verify-reproducible-build.sh \
            scripts/verify-web.py \
            scripts/verify.sh \
            src/main/java/io/rbvm/csv/CsvPlatformServer.java \
            src/main/resources/web/assets.html \
            src/main/resources/web/index.html \
            src/test/java/io/rbvm/csv/CsvHttpSelfTest.java
          git diff --cached --check
          git commit -m 'Add V20 managed assets UI'
          git push origin HEAD:agent/managed-assets-ui-v20

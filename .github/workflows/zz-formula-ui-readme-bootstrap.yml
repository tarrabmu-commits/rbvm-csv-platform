name: formula-ui-readme-bootstrap

on:
  push:
    branches:
      - frontend/rbvm-formula-v1-presentation-v1

permissions:
  contents: write

jobs:
  patch-readme:
    if: ${{ !contains(github.event.head_commit.message, 'Align README with Formula browser presentation') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: frontend/rbvm-formula-v1-presentation-v1
      - name: Align Formula presentation documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "Frontend V2 deliberately does **not** fabricate historical trends when the current API cannot support defensible historical aggregation. It also does not yet expose the RBVM Formula result, a remediation priority, SLA, or remediation ranking in the browser product surface.":
              "Frontend V2 deliberately does **not** fabricate historical trends when the current API cannot support defensible historical aggregation. It now exposes exact replay-verified RBVM Formula V1 and derived-risk methodology results through explicit immutable identities, while remediation priority, SLA, treatment, and remediation ranking remain outside the browser risk-result surface.",
              "Browser presentation is not implemented yet.":
              "Frontend System V2 now presents exact replay-verified Formula V1 results through explicit Finding, Decision Input V3, and Formula catalog identities; the browser performs no Formula arithmetic or implicit current/latest selection.",
              "The next Formula-layer increment is browser presentation that consumes the exact replay-verified read API and invokes materialization only by exact persisted Decision Input V3 identity. Priority, Treatment, SLA, remediation deadlines, and workflow policy remain separate later contracts and must not be hidden inside Formula V1.":
              "Formula V1 browser presentation now consumes the exact replay-verified read API, discovers the accepted Formula identity through the no-default Formula catalog, and invokes materialization only by exact persisted Decision Input V3 identity. Priority, Treatment, SLA, remediation deadlines, and workflow policy remain separate later contracts and must not be hidden inside Formula V1 or browser presentation."
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'README Formula presentation text drifted: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m 'Align README with Formula browser presentation'
          git push origin HEAD:frontend/rbvm-formula-v1-presentation-v1

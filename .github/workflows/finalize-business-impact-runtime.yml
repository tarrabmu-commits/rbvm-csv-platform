name: finalize-business-impact-runtime-once

on:
  push:
    branches:
      - agent/business-impact-api-ui

permissions:
  contents: write

concurrency:
  group: finalize-business-impact-runtime-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/business-impact-api-ui
          fetch-depth: 0
      - name: Correct finalizer constructor locator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize-business-impact-runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '    full_start = text.index("    public CsvPlatformServer(\\n", text.index("Optional<BusinessImpactImporter> businessImpactImporter" ) - 1200)\n'
          new = '''    signature_marker = """            Optional<BusinessImpactImporter> businessImpactImporter,\n            Optional<BusinessImpactEvidenceReader> businessImpactEvidenceReader,\n            ApiKeyAuthenticator authenticator,\n"""\n    signature_index = text.index(signature_marker)\n    full_start = text.rfind("    public CsvPlatformServer(\\n", 0, signature_index)\n    if full_start < 0:\n        raise RuntimeError("server V15 constructor start not found")\n'''
          if text.count(old) != 1:
              raise SystemExit(f'constructor locator anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply V15 Business Impact runtime wiring
        run: python3 scripts/finalize-business-impact-runtime.py
      - name: Verify finalized runtime
        run: ./scripts/verify.sh
      - name: Remove one-shot tooling and publish final branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/finalize-business-impact-runtime.py .github/workflows/finalize-business-impact-runtime.yml
          git add src/main/java/io/rbvm/postgres/CanonicalProjectionFactory.java
          git add src/main/java/io/rbvm/csv/CsvPlatformServer.java
          git add src/test/java/io/rbvm/csv/PlatformSelfTest.java
          git add src/test/java/io/rbvm/postgres/PostgresFoundationSelfTest.java
          git add scripts/verify-web.py
          git commit -m "Wire Business Impact V15 runtime API and UI"
          git push origin HEAD:agent/business-impact-api-ui

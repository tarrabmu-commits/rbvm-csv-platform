name: clean-v14-one-shot-tooling

on:
  push:
    branches: [agent/network-reachability-postgres]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Converge on latest remote head and remove one-shot files
        run: |
          sleep 20
          git fetch origin agent/network-reachability-postgres
          git reset --hard origin/agent/network-reachability-postgres
          rm -f \
            scripts/align-v14-reachability.py \
            scripts/finalize-v14-reachability.py \
            .github/workflows/align-v14-reachability.yml \
            .github/workflows/finalize-v14-reachability.yml \
            .github/workflows/zz-clean-v14.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No one-shot tooling remains'
          else
            git commit -m 'Remove V14 one-shot tooling'
            git push origin HEAD:agent/network-reachability-postgres
          fi

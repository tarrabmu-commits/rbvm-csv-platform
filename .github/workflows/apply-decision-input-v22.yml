name: apply-decision-input-v22

on:
  push:
    branches: [agent/decision-input-v22]
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-compile:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[v22-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/decision-input-v22
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply exact-context V22 PostgreSQL patches
        run: |
          if grep -q 'RbvmDecisionInputSnapshot.BindingKind' src/main/java/io/rbvm/postgres/PostgresDecisionInputSnapshotBuilder.java; then
            echo 'V22 PostgreSQL patch already applied'
          else
            python3 .rbvm-v22/03_builder.py
            python3 .rbvm-v22/04_resolved_resolver.py
            python3 .rbvm-v22/05_store_migrator.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/test/java/io/rbvm/postgres/PostgresMigratorSelfTest.java')
          text = path.read_text()
          changes = {
              'assert migrator.migrate() == 19;': 'assert migrator.migrate() == 20;',
              'assert database.checksums.size() == 19;': 'assert database.checksums.size() == 20;',
              'assert database.commits == 19;': 'assert database.commits == 20;',
              'assert database.commits == 19 : "replay must not reapply migrations";':
                  'assert database.commits == 20 : "replay must not reapply migrations";'
          }
          for old, new in changes.items():
              if old not in text:
                  if new in text:
                      continue
                  raise SystemExit(f'missing exact migrator self-test context: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Compile main and tests
        run: ./scripts/compile.sh --tests
      - name: Run platform self-tests
        run: java -ea -cp build/manual/main:build/manual/test io.rbvm.csv.PlatformSelfTest
      - name: Commit verified V22 core
        run: |
          git config user.name 'rbvm-v22-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            src/main/java/io/rbvm/decision/RbvmResolvedDecisionInput.java \
            src/main/java/io/rbvm/postgres/PostgresDecisionInputSnapshotBuilder.java \
            src/main/java/io/rbvm/postgres/PostgresDecisionInputEvidenceResolver.java \
            src/main/java/io/rbvm/postgres/PostgresDecisionInputSnapshotStore.java \
            src/main/java/io/rbvm/postgres/PostgresMigrator.java \
            src/test/java/io/rbvm/postgres/PostgresMigratorSelfTest.java
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No V22 core changes to commit'
            exit 0
          fi
          git commit -m 'Integrate managed asset context into Decision Input V2 [v22-applied]'
          git push origin HEAD:agent/decision-input-v22

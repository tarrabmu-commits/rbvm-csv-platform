name: apply-decision-input-v22

on:
  push:
    branches: [agent/decision-input-v22]
  pull_request:

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[v22-finalized]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/decision-input-v22
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install OpenAPI verifier dependency
        run: python -m pip install --require-hashes -r scripts/verification-requirements.txt
      - name: Align V22 release version
        run: python3 .rbvm-v22/06_finalize.py
      - name: Verify 0.22.0 release contract
        run: ./scripts/verify-release-version.sh v0.22.0
      - name: Verify code API SQL web and scripts
        run: ./scripts/verify.sh
      - name: Verify reproducible distribution
        run: ./scripts/verify-reproducible-build.sh
      - name: Commit verified V22 release alignment
        run: |
          git config user.name 'rbvm-v22-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            build.gradle.kts \
            api/openapi.yaml \
            scripts/build-distribution.sh \
            scripts/verify-reproducible-build.sh \
            .github/workflows/verify.yml \
            .github/workflows/release.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No V22 release changes to commit'
            exit 0
          fi
          git commit -m 'Align V22 release contract at 0.22.0 [v22-finalized]'
          git push origin HEAD:agent/decision-input-v22
